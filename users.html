<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>个人中心 - 2024级8班</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,"Microsoft YaHei",sans-serif;}
body{
  min-height:100vh;
  background:linear-gradient(135deg,#6366f1 0%,#ec4899 100%);
  padding:20px;
  color:#334155;
}
.wrap{max-width:500px;margin:0 auto;}
.card{
  background:#fff;border-radius:16px;padding:28px 24px;
  box-shadow:0 8px 20px rgba(0,0,0,0.12);
  margin-bottom:16px;
}
.card h3{
  font-size:17px;color:#1e293b;margin-bottom:16px;
  padding-bottom:10px;border-bottom:1px solid #e2e8f0;
}
.form-group{margin-bottom:14px;}
.form-group label{
  display:block;font-size:13px;color:#64748b;margin-bottom:6px;
}
.form-group input{
  width:100%;padding:11px 14px;border:1px solid #cbd5e1;
  border-radius:10px;font-size:15px;outline:none;
  transition:border-color 0.2s;
}
.form-group input:focus{border-color:#6366f1;}
.btn{
  width:100%;padding:12px;border:none;border-radius:10px;
  background:linear-gradient(135deg,#6366f1,#8b5cf6);
  color:#fff;font-size:15px;cursor:pointer;
  transition:opacity 0.2s;
}
.btn:hover{opacity:0.9;}
.btn-red{
  background:linear-gradient(135deg,#ef4444,#f87171);
}
.links{
  display:flex;justify-content:space-between;margin-top:10px;
  flex-wrap:wrap;gap:8px;
}
.links a{
  color:#fff;text-decoration:none;font-size:14px;opacity:0.9;
}
.links a:hover{opacity:1;text-decoration:underline;}
.tip{font-size:12px;color:#94a3b8;margin-top:8px;line-height:1.5;}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h3>✏️ 修改昵称</h3>
    <div class="form-group">
      <label>当前昵称</label>
      <input type="text" id="nickInput" placeholder="输入你的昵称">
    </div>
    <button class="btn" id="saveNick">保存昵称</button>
    <p class="tip">昵称保存在数据库，换电脑/换浏览器都在，同学在成员空间能看到。</p>
  </div>
  <div class="links">
    <a href="index.html">← 返回首页</a>
    <a href="users.html">成员空间 →</a>
    <a href="message.html">留言空间 →</a>
  </div>
  <br>
  <button class="btn btn-red" id="logout">退出登录</button>
</div>
<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm'

const supabaseUrl = "https://joqqxqzhdhqhcmnbdnex.supabase.co"
const supabaseAnonKey = "sb_publishable_Vj7vzrM66ieR8Yx11CgfsQ_45Y1o35O"
const supabase = createClient(supabaseUrl, supabaseAnonKey)

let user = null;

async function init(){
  const {data:{user:u}, error} = await supabase.auth.getUser()
  if(!u){
    window.location.href = "login.html"
    return
  }
  user = u

  const {data} = await supabase
    .from('user_profile')
    .select('nickname')
    .eq('id', user.id)
    .single()

  if(data){
    document.getElementById('nickInput').value = data.nickname || ''
  }
}

document.getElementById('saveNick').onclick = async ()=>{
  const newNick = document.getElementById('nickInput').value.trim()
  if(!newNick){
    alert("昵称不能为空！")
    return
  }
  const {error} = await supabase
    .from('user_profile')
    .update({nickname: newNick})
    .eq('id', user.id)
  if(error){
    alert("保存失败：" + error.message)
  }else{
    alert("昵称修改成功！")
  }
}

document.getElementById('logout').onclick = async ()=>{
  await supabase.auth.signOut()
  window.location.href = "login.html"
}

init()
</script>
</body>
</html>
