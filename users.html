<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>个人中心 - 2024级8班</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,"Microsoft YaHei",sans-serif;}
body{
  min-height:100vh;
  background:linear-gradient(135deg,#6366f1 0%,#ec4899 100%);
  padding:20px;color:#334155;
}
.wrap{max-width:500px;margin:0 auto;}
.top-bar{
  display:flex;justify-content:space-between;align-items:center;
  margin-bottom:20px;flex-wrap:wrap;gap:10px;
}
.top-bar a{color:#fff;text-decoration:none;font-size:14px;opacity:0.9;}
.top-bar a:hover{opacity:1;}
.top-bar h2{color:#fff;font-size:20px;}
.card{
  background:#fff;border-radius:20px;padding:28px 24px;
  box-shadow:0 12px 30px rgba(0,0,0,0.15);
  text-align:center;
}
.big-avatar{
  width:80px;height:80px;border-radius:50%;
  background:linear-gradient(135deg,#6366f1,#ec4899);
  color:#fff;display:flex;align-items:center;justify-content:center;
  font-size:32px;font-weight:bold;margin:0 auto 16px;
}
.big-avatar.female{background:linear-gradient(135deg,#ec4899,#f472b6);}
.big-avatar.secret{background:linear-gradient(135deg,#64748b,#94a3b8);}
.name{font-size:20px;font-weight:bold;color:#1e293b;margin-bottom:6px;}
.gender-tag{
  display:inline-block;padding:4px 16px;border-radius:999px;
  font-size:13px;background:#eef2ff;color:#4f46e5;margin-bottom:18px;
}
.gender-tag.female{background:#fdf2f8;color:#db2777;}
.gender-tag.secret{background:#f1f5f9;color:#64748b;}
.info-row{
  padding:14px 0;border-top:1px solid #e2e8f0;
  text-align:left;
}
.info-row .label{font-size:13px;color:#94a3b8;margin-bottom:4px;}
.info-row .value{font-size:15px;color:#334155;line-height:1.6;}
.btn{
  display:block;width:100%;padding:13px;border:none;border-radius:12px;
  background:linear-gradient(135deg,#ef4444,#f87171);
  color:#fff;font-size:15px;font-weight:bold;cursor:pointer;
  margin-top:16px;transition:opacity 0.2s;
}
.btn:hover{opacity:0.9;}
.links{
  display:flex;justify-content:center;gap:20px;margin-top:18px;flex-wrap:wrap;
}
.links a{color:#fff;text-decoration:none;font-size:14px;opacity:0.9;}
.links a:hover{opacity:1;}
.loading{color:#fff;text-align:center;padding:40px;font-size:15px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="top-bar">
    <a href="index.html">← 返回首页</a>
    <h2>👤 个人中心</h2>
    <a href="users.html">成员空间 →</a>
  </div>

  <div id="loading" class="loading">加载中...</div>

  <div id="userCard" class="card" style="display:none;">
    <div class="big-avatar" id="avatar">?</div>
    <div class="name" id="name">--</div>
    <span class="gender-tag" id="gender">保密</span>

    <div class="info-row">
      <div class="label">座号</div>
      <div class="value" id="username">--</div>
    </div>
    <div class="info-row">
      <div class="label">个性签名</div>
      <div class="value" id="signature">这个人很懒，什么都没留下</div>
    </div>

    <button class="btn" id="logout">退出登录</button>
  </div>

  <div class="links">
    <a href="space.html">💬 互动空间</a>
    <a href="message.html">✏️ 发布</a>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SB_URL = "https://grwawlhjdalnioetwhjs.supabase.co";
const SB_KEY = "sb_publishable_g5q1KeSc2fLoWDlgguD_Yw_ELd3Aao3";
const sb = window.supabase.createClient(SB_URL, SB_KEY);

async function init(){
  const {data:{session}} = await sb.auth.getSession();
  if(!session || !session.user){
    window.location.href = "login.html";
    return;
  }
  const me = session.user;

  const {data, error} = await sb
    .from("profiles")
    .select("username, gender, signature")
    .eq("id", me.id)
    .single();

  document.getElementById("loading").style.display = "none";
  document.getElementById("userCard").style.display = "block";

  if(error || !data){
    document.getElementById("name").innerText = "同学";
    document.getElementById("username").innerText = me.email || "--";
    return;
  }

  const g = data.gender || "保密";
  const cls = g === "女" ? "female" : (g === "保密" ? "secret" : "");

  document.getElementById("avatar").className = "big-avatar " + cls;
  document.getElementById("avatar").innerText = (data.username || "?").charAt(0);
  document.getElementById("name").innerText = data.username || "未设置";
  document.getElementById("gender").className = "gender-tag " + cls;
  document.getElementById("gender").innerText = g;
  document.getElementById("username").innerText = data.username || "--";
  document.getElementById("signature").innerText = data.signature || "这个人很懒，什么都没留下";
}

document.getElementById("logout").onclick = async () => {
  if(confirm("确定退出登录吗？")){
    await sb.auth.signOut();
    window.location.href = "login.html";
  }
};

init();
</script>
</body>
</html>
