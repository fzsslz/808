<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>扫雷</title>
<style>
:root {
    --primary-rgb:99, 102, 241;
    --primary:#6366f1;
    --primary-deep:#4f46e5;
    --accent-rgb:236, 72, 153;
    --pink:#ec4899;
    --pink-deep:#db2777;
    --primary-text:#4f46e5;
    --text-main:#334155;
    --light-bg:#fdf4ff;
    --light-bg-2:#e0e7ff;
    --dark-bg-1:#1e1b4b;
    --dark-bg-2:#312e81;
    --dark-text:#ffffff;
    --dark-text-secondary:#c7d2fe;
    --radius-md:10px;
}
body.theme-blue {
    --primary-rgb:14, 165, 233;
    --primary:#0ea5e9;
    --primary-deep:#0284c7;
    --accent-rgb:6, 182, 212;
    --pink:#06b6d4;
    --pink-deep:#0891b2;
    --primary-text:#0369a1;
    --text-main:#0c4a6e;
    --light-bg:#f0f9ff;
    --light-bg-2:#e0f2fe;
    --dark-bg-1:#0c1929;
    --dark-bg-2:#112240;
    --dark-text:#e0f2fe;
    --dark-text-secondary:#7dd3fc;
}
body.theme-gold {
    --primary-rgb:245, 158, 11;
    --primary:#f59e0b;
    --primary-deep:#d97706;
    --accent-rgb:249, 115, 22;
    --pink:#f97316;
    --pink-deep:#ea580c;
    --primary-text:#92400e;
    --text-main:#78350f;
    --light-bg:#fffbeb;
    --light-bg-2:#fef3c7;
    --dark-bg-1:#422006;
    --dark-bg-2:#78350f;
    --dark-text:#fffbeb;
    --dark-text-secondary:#fcd34d;
}
body.theme-green {
    --primary-rgb:16, 185, 129;
    --primary:#10b981;
    --primary-deep:#059669;
    --accent-rgb:20, 184, 166;
    --pink:#14b8a6;
    --pink-deep:#0d9488;
    --primary-text:#065f46;
    --text-main:#064e3b;
    --light-bg:#f0fdf4;
    --light-bg-2:#dcfce7;
    --dark-bg-1:#022c22;
    --dark-bg-2:#064e3b;
    --dark-text:#ecfdf5;
    --dark-text-secondary:#6ee7b7;
}
*{box-sizing:border-box;font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;}
body{
  background:
    radial-gradient(circle at 10% 10%, rgba(var(--primary-rgb), 0.08) 0%, transparent 50%),
    radial-gradient(circle at 90% 20%, rgba(var(--accent-rgb), 0.08) 0%, transparent 50%),
    linear-gradient(135deg, var(--light-bg) 0%, var(--light-bg-2) 100%);
  display:flex;flex-direction:column;align-items:center;padding:10px;margin:0;
  min-height:100vh;color:var(--text-main);
  transition:background 0.35s ease,color 0.35s ease;
}
body.dark{
  background:
    radial-gradient(circle at 10% 10%, rgba(var(--primary-rgb), 0.15) 0%, transparent 50%),
    radial-gradient(circle at 90% 20%, rgba(var(--accent-rgb), 0.15) 0%, transparent 50%),
    linear-gradient(135deg, var(--dark-bg-1) 0%, var(--dark-bg-2) 100%);
  color:var(--dark-text);
}
h2{color:var(--primary);font-size:clamp(20px,5vw,28px);}
body.dark h2{color:var(--dark-text-secondary);}
#info{display:flex;gap:20px;margin:5px;font-weight:bold;font-size:clamp(13px,2.5vw,16px);}
.ctrl{display:flex;gap:6px;margin:10px 0;flex-wrap:wrap;justify-content:center}
button{
  padding:8px 14px;
  background:linear-gradient(135deg,var(--primary),var(--pink));
  color:white;border:none;border-radius:var(--radius-md);
  font-size:clamp(12px,2.5vw,15px);font-weight:600;cursor:pointer;
  box-shadow:0 4px 12px rgba(var(--primary-rgb),0.25);
  transition:transform 0.2s ease,box-shadow 0.2s ease;
}
button:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(var(--primary-rgb),0.35);}
button:active{transform:scale(0.96);}
#box{
  display:grid;gap:2px;
  background:linear-gradient(135deg,var(--primary),var(--pink));
  padding:8px;border-radius:var(--radius-md);
  box-shadow:0 8px 24px rgba(var(--primary-rgb),0.2);
}
.c{
  width:28px;height:28px;
  background:#fff;
  display:flex;align-items:center;justify-content:center;
  font-weight:bold;border-radius:3px;
  cursor:pointer;
  transition:background 0.15s ease;
}
body.dark .c{background:#2a2a3e;color:#fff;}
#virtual{display:none;margin-top:10px}
@media(max-width:480px){#virtual{display:block}}
</style>
</head>
<body>
<h2>💣 扫雷</h2>
<div id="info">分数:<span id="sc">0</span> 等级:<span id="lv">1</span> 地雷:<span id="ml">10</span></div>
<div class="ctrl">
<button onclick="init(10,10)">简单</button>
<button onclick="init(15,25)">中等</button>
<button onclick="init(20,40)">地狱</button>
<button onclick="init()">重置</button>
</div>
<div id="box"></div>
<div id="virtual">
<button onclick="restart()">重新开始</button>
</div>
<script>
// 自动读取其他页面存的主题与深色设置
(function(){
  const saveTheme = localStorage.getItem("siteTheme");
  const saveStyle = localStorage.getItem("siteStyle");
  if(saveTheme === "dark") document.body.classList.add("dark");
  if(saveStyle) document.body.classList.add(saveStyle);
})();

let s=10,m=10,map=[],op=0,need,sc=0,lv=1;
const box=document.getElementById('box');
function init(ss=10,mm=10){
  s=ss;m=mm;op=sc=lv=0;need=s*s-m;
  box.style.gridTemplateColumns=`repeat(${s},28px)`;
  box.innerHTML='';document.getElementById('ml').innerText=m;
  map=Array(s).fill().map(()=>Array(s).fill(0));
  let n=0;while(n<m){let x=Math.random()*s|0,y=Math.random()*s|0;if(!map[y][x])map[y][x]=9,n++}
  for(let i=0;i<s;i++)for(let j=0;j<s;j++){
    if(map[i][j]==9)continue;let c=0;
    for(let di=-1;di<2;di++)for(let dj=-1;dj<2;dj++)if(map[i+di]?.[j+dj]==9)c++;
    map[i][j]=c;
  }
  for(let i=0;i<s;i++)for(let j=0;j<s;j++){
    let d=document.createElement('div');d.className='c';
    d.onclick=()=>open(i,j);d.oncontextmenu=e=>{e.preventDefault();flag(i,j)};
    box.appendChild(d);
  }
}
function open(i,j){
  let e=box.children[i*s+j];if(e.textContent=='🚩'||e.style.background=='#eee')return;
  if(map[i][j]==9){e.style.background='#f44336';e.textContent='💣';alert('失败');init();return}
  e.textContent=map[i][j]||'';e.style.background='#eee';op++;sc+=5;
  if(op>=need){box.style.animation='win 0.5s infinite';setTimeout(()=>{alert('胜利！');box.style.animation='none'},300)}
  upd();
}
function flag(i,j){let e=box.children[i*s+j];e.textContent=e.textContent=='🚩'?'':'🚩';upd()}
function upd(){document.getElementById('sc').innerText=sc;document.getElementById('lv').innerText=lv}
function restart(){init()}
init();
</script>
<style>@keyframes win{0%{transform:scale(1)}100%{transform:scale(1.03)}}</style>
</body>
</html>
