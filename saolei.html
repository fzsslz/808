<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>扫雷</title>
<style>
*{box-sizing:border-box;font-family:system-ui}
body{background:#f0f2f5;display:flex;flex-direction:column;align-items:center;padding:10px}
h2{color:#37474F}
#info{display:flex;gap:20px;margin:5px;font-weight:bold}
.ctrl{display:flex;gap:6px;margin:10px 0}
button{padding:8px 10px;background:#607D8B;color:white;border:none;border-radius:6px}
#box{display:grid;gap:2px;background:#607D8B;padding:8px;border-radius:8px}
.c{width:28px;height:28px;background:#fff;display:flex;align-items:center;justify-content:center;font-weight:bold}
#virtual{display:none;margin-top:10px}
@media(max-width:480px){#virtual{display:block}}
</style>
</head>
<body>
<h2>💣 扫雷</h2>
<div id="info">分数:<span id="sc">0</span> 等级:<span id="lv">1</span> 地雷:<span id="ml">10</span></div>
<div class="ctrl">
<button onclick="init(10,10)">简单</button>
<button onclick="init(15,25)">中等</button>
<button onclick="init(20,40)">地狱</button>
<button onclick="init()">重置</button>
</div>
<div id="box"></div>
<div id="virtual">
<button onclick="restart()">重新开始</button>
</div>

<script>
let s=10,m=10,map=[],op=0,need,sc=0,lv=1;
const box=document.getElementById('box');

function init(ss=10,mm=10){
  s=ss;m=mm;op=sc=lv=0;need=s*s-m;
  box.style.gridTemplateColumns=`repeat(${s},28px)`;
  box.innerHTML='';document.getElementById('ml').innerText=m;
  map=Array(s).fill().map(()=>Array(s).fill(0));
  let n=0;while(n<m){let x=Math.random()*s|0,y=Math.random()*s|0;if(!map[y][x])map[y][x]=9,n++}
  for(let i=0;i<s;i++)for(let j=0;j<s;j++){
    if(map[i][j]==9)continue;let c=0;
    for(let di=-1;di<2;di++)for(let dj=-1;dj<2;dj++)if(map[i+di]?.[j+dj]==9)c++;
    map[i][j]=c;
  }
  for(let i=0;i<s;i++)for(let j=0;j<s;j++){
    let d=document.createElement('div');d.className='c';
    d.onclick=()=>open(i,j);d.oncontextmenu=e=>{e.preventDefault();flag(i,j)};
    box.appendChild(d);
  }
}

function open(i,j){
  let e=box.children[i*s+j];if(e.textContent=='🚩'||e.style.background=='#eee')return;
  if(map[i][j]==9){e.style.background='#f44336';e.textContent='💣';alert('失败');init();return}
  e.textContent=map[i][j]||'';e.style.background='#eee';op++;sc+=5;
  if(op>=need){box.style.animation='win 0.5s infinite';setTimeout(()=>{alert('胜利！');box.style.animation='none'},300)}
  upd();
}

function flag(i,j){let e=box.children[i*s+j];e.textContent=e.textContent=='🚩'?'':'🚩';upd()}
function upd(){document.getElementById('sc').innerText=sc;document.getElementById('lv').innerText=lv}
function restart(){init()}
init();
</script>
<style>@keyframes win{0%{transform:scale(1)}100%{transform:scale(1.03)}}</style>
</body>
</html>
