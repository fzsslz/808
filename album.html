<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <!-- 手机屏幕适配 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>班级相册</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            transition: background 0.3s, color 0.3s;
        }

        body {
            padding: 20px;
            background: #f5f7fa;
            font-family: "Microsoft YaHei", sans-serif;
        }
        /* 深色全局样式 */
        body.dark {
            background: #1a1a1a;
        }
        body.dark h1 {
            color: #fff;
        }
        body.dark .back-btn {
            background: #0E4BDB;
        }
        body.dark .album img {
            box-shadow: 0 2px 8px rgba(255,255,255,0.1);
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 32px;
            color: #333;
        }

        .back-btn {
            display: inline-block;
            margin: 0 auto 20px;
            padding: 10px 20px;
            background: #1677ff;
            color: #fff;
            border-radius: 8px;
            text-decoration: none;
            font-size: 16px;
        }

        /* 强制最少2列，宽度自适应，最小140px */
        .album {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 15px;
            max-width: 1200px;
            margin: 0 auto;
        }
        /* 小于400px时固定两列，彻底杜绝单列 */
        @media (max-width: 400px) {
            .album {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        .album img {
            width: 100%;
            height: 160px;
            object-fit: cover; /* 修复原图拉伸留白，统一填充裁剪更美观 */
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            transition: transform 0.3s;
            cursor: pointer;
        }

        .album img:hover {
            transform: scale(1.05);
        }

        /* 优化版图片放大遮罩 */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.92);
            z-index: 9999;
            text-align: center;
            padding: 20px;
            overflow: hidden;
        }
        /* 打开遮罩时锁定页面滚动 */
        body.modal-open {
            overflow: hidden;
        }

        .modal-content {
            position: relative;
            display: inline-block;
            margin: auto;
            margin-top: 3vh;
            width: 92vw;
            height: 92vh;
            overflow: hidden;
        }
        #bigImg {
            max-width: 100%;
            max-height: 100%;
            border-radius: 8px;
            box-shadow: 0 0 30px rgba(255,255,255,0.2);
            cursor: grab;
            transform-origin: center center;
        }
        #bigImg:active {
            cursor: grabbing;
        }
        /* 加载提示 */
        .loading-tip {
            color: #fff;
            font-size: 18px;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
        /* 关闭按钮 */
        .close-modal-btn {
            position: fixed;
            top: 20px;
            right: 30px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(255,255,255,0.2);
            color: #fff;
            border: none;
            font-size: 24px;
            cursor: pointer;
            z-index: 10000;
        }
        .close-modal-btn:hover {
            background: rgba(255,255,255,0.4);
        }
        /* 左右切换箭头 */
        .switch-btn {
            position: fixed;
            top: 50%;
            transform: translateY(-50%);
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: rgba(255,255,255,0.2);
            color: #fff;
            border: none;
            font-size: 22px;
            cursor: pointer;
            z-index: 10000;
        }
        .switch-btn:hover {
            background: rgba(255,255,255,0.4);
        }
        .prev-btn {
            left: 20px;
        }
        .next-btn {
            right: 20px;
        }

        .modal.active {
            display: block;
        }
    </style>
</head>

    <!-- 全新升级预览层：支持切换、ESC关闭、加载提示、滚轮缩放、拖拽平移 -->
    <div class="modal" id="imgModal">
        <button class="close-modal-btn" id="closeBtn">×</button>
        <button class="switch-btn prev-btn" id="prevBtn">‹</button>
        <button class="switch-btn next-btn" id="nextBtn">›</button>
        <div class="loading-tip" id="loadingTip">图片加载中...</div>
        <div class="modal-content">
            <img id="bigImg">
        </div>
    </div>

    <!-- 返回顶部按钮 -->
    <button id="backTopBtn" style="position:fixed;right:24px;bottom:80px;width:50px;height:50px;border-radius:50%;background:#165DFF;border:none;opacity:0;visibility:hidden;transition:0.3s all ease;z-index:998;box-shadow:0 4px 12px rgba(22,93,255,0.3);display:flex;align-items:center;justify-content:center;cursor:pointer;">
        <span style="width:0;height:0;border-left:10px solid transparent;border-right:10px solid transparent;border-bottom:16px solid #fff;"></span>
    </button>

<script>
// 页面加载自动同步深浅色记忆
(function(){
  const saveTheme = localStorage.getItem("siteTheme");
  const darkBtn = document.getElementById("darkBtn");
  if(saveTheme === "dark"){
    document.body.classList.add("dark");
    darkBtn.innerText = "浅色模式";
  }
})();

// 相册图片预览升级逻辑
const imgWrap = document.getElementById("imgList");
const allImgs = Array.from(imgWrap.querySelectorAll(".album img"));
const modal = document.getElementById('imgModal');
const bigImg = document.getElementById('bigImg');
const loadingTip = document.getElementById('loadingTip');
const closeBtn = document.getElementById('closeBtn');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
let currentIndex = 0;

// 缩放拖拽变量
let scale = 1;
let offsetX = 0;
let offsetY = 0;
let isDrag = false;
let dragStartX = 0;
let dragStartY = 0;

// 重置图片缩放偏移
function resetImgTransform() {
    scale = 1;
    offsetX = 0;
    offsetY = 0;
    bigImg.style.transform = `translate(${offsetX}px, ${offsetY}px) scale(${scale})`;
}

// 过滤空src空白图片，禁止点击
allImgs.forEach((img, idx) => {
    if(!img.src || img.src.endsWith('/')) {
        img.style.cursor = "default";
        img.style.opacity = "0.35";
        return;
    }
    img.onclick = ()=> openPreview(idx);
})

// 打开预览
function openPreview(index) {
    resetImgTransform();
    currentIndex = index;
    const targetImg = allImgs[currentIndex];
    loadingTip.style.display = "block";
    modal.classList.add('active');
    document.body.classList.add("modal-open"); // 锁定底层滚动
    bigImg.src = targetImg.src;
    // 图片加载完成隐藏加载文字
    bigImg.onload = ()=> loadingTip.style.display = "none";
}

// 关闭预览
function closeModal() {
    modal.classList.remove('active');
    document.body.classList.remove("modal-open");
    bigImg.src = "";
    resetImgTransform();
}

// 切换上一张
function prevImg() {
    resetImgTransform();
    currentIndex = currentIndex - 1 < 0 ? allImgs.length - 1 : currentIndex - 1;
    // 跳过空白无效图片
    while(!allImgs[currentIndex].src || allImgs[currentIndex].src.endsWith('/')) {
        currentIndex = currentIndex - 1 < 0 ? allImgs.length - 1 : currentIndex - 1;
    }
    openPreview(currentIndex);
}
// 切换下一张
function nextImg() {
    resetImgTransform();
    currentIndex = currentIndex + 1 >= allImgs.length ? 0 : currentIndex + 1;
    while(!allImgs[currentIndex].src || allImgs[currentIndex].src.endsWith('/')) {
        currentIndex = currentIndex + 1 >= allImgs.length ? 0 : currentIndex + 1;
    }
    openPreview(currentIndex);
}

// 绑定所有关闭、切换事件
closeBtn.onclick = closeModal;
prevBtn.onclick = prevImg;
nextBtn.onclick = nextImg;
// 点击遮罩空白处关闭，点击图片本体不关闭
modal.onclick = (e)=> {
    if(e.target === modal) closeModal();
}
// 键盘快捷键：ESC关闭，左右箭头切换
document.addEventListener("keydown", (e)=>{
    if(!modal.classList.contains("active")) return;
    if(e.key === "Escape") closeModal();
    if(e.key === "ArrowLeft") prevImg();
    if(e.key === "ArrowRight") nextImg();
})

// ========== 滚轮缩放 ==========
bigImg.addEventListener('wheel', (e)=>{
    e.preventDefault();
    const zoomSpeed = 0.08;
    if(e.deltaY < 0) {
        scale += zoomSpeed;
    } else {
        scale -= zoomSpeed;
    }
    // 限制缩放范围 0.3 ~ 5倍
    scale = Math.max(0.3, Math.min(scale, 5));
    bigImg.style.transform = `translate(${offsetX}px, ${offsetY}px) scale(${scale})`;
})

// ========== 鼠标拖拽平移 ==========
bigImg.addEventListener('mousedown', (e)=>{
    isDrag = true;
    dragStartX = e.clientX - offsetX;
    dragStartY = e.clientY - offsetY;
})
document.addEventListener('mousemove', (e)=>{
    if(!isDrag) return;
    offsetX = e.clientX - dragStartX;
    offsetY = e.clientY - dragStartY;
    bigImg.style.transform = `translate(${offsetX}px, ${offsetY}px) scale(${scale})`;
})
document.addEventListener('mouseup', ()=> isDrag = false);
// 双击重置缩放
bigImg.addEventListener('dblclick', resetImgTransform);

// 返回顶部逻辑
const backBtn = document.getElementById("backTopBtn");
backBtn.onmouseover = ()=> backBtn.style.background="#0E4BDB";
backBtn.onmouseout = ()=> backBtn.style.background="#165DFF";
window.addEventListener("scroll",()=>{
  if(window.scrollY > 300){
    backBtn.style.opacity = "1";
    backBtn.style.visibility = "visible";
  }else{
    backBtn.style.opacity = "0";
    backBtn.style.visibility = "hidden";
  }
})
backBtn.onclick = ()=> window.scrollTo({top:0,behavior:"smooth"});

// 深色模式切换函数（带本地存储，跨页面同步）
function toggleDark() {
  const body = document.body;
  const btn = document.getElementById("darkBtn");
  body.classList.toggle("dark");
  let nowTheme;
  if (body.classList.contains("dark")) {
    btn.innerText = "浅色模式";
    nowTheme = "dark";
  } else {
    btn.innerText = "深色模式";
    nowTheme = "light";
  }
  localStorage.setItem("siteTheme", nowTheme);
}
</script>
