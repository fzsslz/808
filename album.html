<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>班级相册</title>
    <style>
        :root {
            --primary: #6366f1;
            --primary-deep: #4f46e5;
            --pink: #ec4899;
            --pink-deep: #db2777;
            --glass-light: rgba(255,255,255,0.85);
            --glass-border: rgba(255,255,255,0.6);
            --shadow-soft: 0 8px 24px rgba(99, 102, 241, 0.12);
            --shadow-hover: 0 16px 36px rgba(99, 102, 241, 0.18);
            --radius-md: 16px;
            --radius-lg: 24px;
            --transition-normal: 0.35s ease;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            transition: background var(--transition-normal), color var(--transition-normal), transform 0.25s ease, box-shadow var(--transition-normal);
        }
        body {
            padding: 24px 16px;
            font-family: "Microsoft YaHei", sans-serif;
            background:
                radial-gradient(circle at 10% 10%, rgba(99, 102, 241, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 90% 20%, rgba(236, 72, 153, 0.08) 0%, transparent 50%),
                linear-gradient(135deg, #fdf4ff 0%, #e0e7ff 100%);
            min-height: 100vh;
        }
        body.dark {
            background:
                radial-gradient(circle at 10% 10%, rgba(129, 140, 248, 0.12) 0%, transparent 50%),
                radial-gradient(circle at 90% 20%, rgba(244, 114, 182, 0.12) 0%, transparent 50%),
                linear-gradient(135deg, #1e1b4b 0%, #312e81 100%);
        }
        body.dark h1 {
            color: #c7d2fe;
        }
        body.dark .back-btn {
            background: linear-gradient(135deg,var(--primary-deep),var(--pink-deep));
        }
        body.dark .back-btn:hover {
            background: linear-gradient(135deg,#3b36a1,#b91c5c);
        }
        body.dark .album img {
            box-shadow: 0 4px 16px rgba(0,0,0,0.35);
            border: 1px solid rgba(255,255,255,0.12);
        }
        header {
            text-align: center;
            margin-bottom: 28px;
        }
        h1 {
            font-size: clamp(26px,6vw,36px);
            color: var(--primary);
            font-weight: 700;
            letter-spacing: 1px;
            position: relative;
            display: inline-block;
            margin-bottom: 12px;
        }
        h1::after {
            content: "";
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            bottom: -10px;
            width: 100px;
            height: 4px;
            background: linear-gradient(90deg,var(--primary),var(--pink));
            border-radius: 4px;
        }
        .back-btn {
            display: inline-block;
            margin: 0 auto 24px;
            padding: 12px 26px;
            background: linear-gradient(135deg,var(--primary),var(--pink));
            color: #fff;
            border-radius: var(--radius-md);
            text-decoration: none;
            font-size: 16px;
            font-weight: 600;
            box-shadow: 0 6px 16px rgba(99, 102, 241, 0.25);
        }
        .back-btn:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 24px rgba(99, 102, 241, 0.35);
        }
        .back-btn:active {
            transform: translateY(-2px) scale(0.97);
        }
        .album {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 18px;
            max-width: 1240px;
            margin: 0 auto;
        }
        @media (max-width: 400px) {
            .album {
                grid-template-columns: repeat(2, 1fr);
                gap: 14px;
            }
        }
        .album img {
            width: 100%;
            height: 160px;
            object-fit: cover;
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-soft);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
            border: 1px solid var(--glass-border);
            background: #000;
        }
        .album img:hover {
            transform: translateY(-6px) scale(1.05);
            box-shadow: var(--shadow-hover);
        }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.92);
            z-index: 9999;
            overflow: hidden;
        }
        body.modal-open {
            overflow: hidden;
        }
        .modal.active {
            display: block;
        }
        .modal-content {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #bigImg {
            max-width: 92vw;
            max-height: 92vh;
            border-radius: var(--radius-md);
            box-shadow: 0 0 30px rgba(255,255,255,0.2);
            cursor: grab;
            touch-action: none;
            transform-origin: center center;
        }
        #bigImg:active {
            cursor: grabbing;
        }
        .loading-tip {
            color: #fff;
            font-size: 18px;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
        .close-modal-btn {
            position: fixed;
            top: 20px;
            right: 30px;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(255,255,255,0.2);
            color: #fff;
            border: none;
            font-size: 24px;
            cursor: pointer;
            z-index: 10000;
            backdrop-filter: blur(8px);
        }
        .close-modal-btn:hover {
            background: rgba(255,255,255,0.4);
            transform: scale(1.1);
        }
        .switch-btn {
            position: fixed;
            top: 50%;
            transform: translateY(-50%);
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: rgba(255,255,255,0.2);
            color: #fff;
            border: none;
            font-size: 24px;
            cursor: pointer;
            z-index: 10000;
            backdrop-filter: blur(8px);
        }
        .switch-btn:hover {
            background: rgba(255,255,255,0.4);
            transform: translateY(-50%) scale(1.1);
        }
        .prev-btn { left: 20px; }
        .next-btn { right: 20px; }

        .edit-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(0,0,0,0.7);
            display: none;
            padding: 14px 16px;
            z-index: 10001;
            backdrop-filter: blur(12px);
        }
        .modal.active .edit-bar {
            display: flex;
            gap: 12px;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
        }
        .edit-bar button {
            padding: 9px 14px;
            border: none;
            border-radius: var(--radius-md);
            background: #fff;
            color: #222;
            font-size: 14px;
            cursor: pointer;
            font-weight: 500;
        }
        .edit-bar button.active {
            background: linear-gradient(135deg,var(--primary),var(--pink));
            color: white;
        }
        .edit-bar button:disabled {
            background:#cccccc;
            color:#888888;
            cursor:not-allowed;
        }
        .color-box {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            border: 2px solid #fff;
            cursor: pointer;
        }
        .color-box.active {
            box-shadow: 0 0 0 3px var(--primary);
            transform: scale(1.15);
        }
        /* 画笔滑块样式 */
        .slider-wrap{
            display:flex;
            align-items:center;
            gap:10px;
            background:rgba(255,255,255,0.15);
            padding:6px 12px;
            border-radius: var(--radius-md);
        }
        #lineSlider{
            width:130px;
        }
        .size-label{
            color:#fff;
            font-size:13px;
            min-width:36px;
        }
        /* 修复画布层级，精准贴合大图，跟随缩放拖拽 */
        #drawCanvas {
            position: absolute;
            pointer-events: none;
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
            top: 0;
            left: 0;
        }
        #drawCanvas.draw-mode {
            pointer-events: auto;
        }
        .crop-box {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.85);
            z-index: 10002;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            backdrop-filter: blur(6px);
        }
        .crop-box.active {
            display: flex;
        }
        .crop-container{
            position:relative;
        }
        .crop-canvas {
            max-width: 90vw;
            max-height: 70vh;
            border: 2px solid white;
            border-radius: var(--radius-md);
            touch-action: none;
        }
        /* 裁剪选区框 */
        #cropSelector{
            position:absolute;
            border:2px dashed #fff;
            box-shadow: 0 0 0 9999px rgba(0,0,0,0.45);
            pointer-events:none;
            border-radius:4px;
        }
        .crop-actions {
            margin-top: 18px;
            display: flex;
            gap: 16px;
        }
        .crop-actions button {
            padding: 10px 24px;
            border: none;
            border-radius: var(--radius-md);
            font-size: 15px;
            cursor: pointer;
            font-weight: 500;
        }
        .crop-actions button:first-child {
            background: linear-gradient(135deg,var(--primary),var(--pink));
            color:#fff;
        }
        .save-preview {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.95);
            z-index: 10003;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            padding: 20px;
            backdrop-filter: blur(8px);
        }
        .save-preview.active {
            display: flex;
        }
        .save-tip {
            color: white;
            margin-top: 14px;
            font-size: 15px;
        }
        #saveImg {
            max-width: 90vw;
            max-height: 75vh;
            border-radius: var(--radius-md);
        }
        #closeSave {
            margin-top: 16px;
            padding: 10px 26px;
            border: none;
            border-radius: var(--radius-md);
            cursor: pointer;
            background: linear-gradient(135deg,var(--primary),var(--pink));
            color:#fff;
            font-weight:500;
        }
    </style>
</head>

<script>
function isWeChatBrowser() {
    return /MicroMessenger/i.test(navigator.userAgent);
}
(function(){
  const saveTheme = localStorage.getItem("siteTheme");
  const darkBtn = document.getElementById("darkBtn");
  if(saveTheme === "dark"){
    document.body.classList.add("dark");
    darkBtn.innerText = "浅色模式";
  }
})();
function toggleDark(){
  const body = document.body;
  const btn = document.getElementById("darkBtn");
  body.classList.toggle("dark");
  const isDark = body.classList.contains("dark");
  btn.innerText = isDark ? "浅色模式" : "🌙 深色模式";
  localStorage.setItem("siteTheme", isDark ? "dark" : "light");
}

const imgWrap = document.getElementById("imgList");
const allImgs = Array.from(imgWrap.querySelectorAll(".album img"));
const modal = document.getElementById('imgModal');
const bigImg = document.getElementById('bigImg');
const loadingTip = document.getElementById('loadingTip');
const closeBtn = document.getElementById('closeBtn');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const drawCanvas = document.getElementById("drawCanvas");
const drawCtx = drawCanvas.getContext("2d");
const cropModal = document.getElementById("cropModal");
const cropCanvas = document.getElementById("cropCanvas");
const cropCtx = cropCanvas.getContext("2d");
const cropSelector = document.getElementById("cropSelector");
const saveModal = document.getElementById("saveModal");
const saveImg = document.getElementById("saveImg");
const saveEditBtn = document.getElementById("saveEdit");

let currentIndex = 0;
let scale = 1;
let offsetX = 0;
let offsetY = 0;
let isDrag = false;
let dragStartX = 0, dragStartY = 0;
let touchStartDist = 0;
let touchCenterX = 0, touchCenterY = 0;

let drawHistory = [];
let isDrawing = false;
let drawMode = false;
let drawColor = "#ff3333";
let lineWidth = 8;
let isEraser = false;
const dpr = window.devicePixelRatio || 1;
let lastDrawX = 0, lastDrawY = 0;
let editFinalImg = null;
let cropOpen = false;

//裁剪全局变量
let cropActive = false;
let cropStart = {x:0,y:0};

//画笔粗细滑块绑定
const lineSlider = document.getElementById("lineSlider");
const sizeVal = document.getElementById("sizeVal");
lineSlider.oninput = function(){
    lineWidth = Number(this.value);
    sizeVal.innerText = lineWidth;
}

// 图片缩放拖拽实时同步画布位置大小
function syncCanvasPosition() {
  const imgRect = bigImg.getBoundingClientRect();
  drawCanvas.style.left = imgRect.left + "px";
  drawCanvas.style.top = imgRect.top + "px";
  drawCanvas.style.width = imgRect.width + "px";
  drawCanvas.style.height = imgRect.height + "px";
  drawCanvas.width = imgRect.width * dpr;
  drawCanvas.height = imgRect.height * dpr;
  drawCtx.setTransform(1,0,0,1,0,0);
  drawCtx.scale(dpr, dpr);
  drawCtx.lineCap = "round";
  drawCtx.lineJoin = "round";
}

function updateImgTransform() {
  bigImg.style.transform = `translate(${offsetX}px, ${offsetY}px) scale(${scale})`;
  syncCanvasPosition();
}
function resetImgTransform() {
  scale = 1;
  offsetX = 0;
  offsetY = 0;
  updateImgTransform();
}
function clearDrawCanvas() {
  drawCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
  drawHistory = [];
}

// 精准坐标转换
function getDrawGlobalPos(clientX, clientY) {
  const canvasRect = drawCanvas.getBoundingClientRect();
  return {
    x: clientX - canvasRect.left,
    y: clientY - canvasRect.top
  };
}

function openPreview(index) {
  resetImgTransform();
  clearDrawCanvas();
  drawMode = false;
  drawCanvas.classList.remove("draw-mode");
  document.querySelectorAll(".edit-bar button").forEach(b => b.classList.remove("active"));
  document.querySelectorAll(".color-box").forEach(c => c.classList.remove("active"));
  document.querySelector(`.color-box[data-color="${drawColor}"]`)?.classList.add("active");
  cropOpen = false;
  saveEditBtn.disabled = false;

  currentIndex = index;
  const targetImg = allImgs[currentIndex];
  loadingTip.style.display = "block";
  modal.classList.add('active');
  document.body.classList.add("modal-open");
  bigImg.src = targetImg.src;
  bigImg.onload = () => {
    loadingTip.style.display = "none";
    setTimeout(syncCanvasPosition, 100);
  };
}
function closeModal() {
  modal.classList.remove('active');
  document.body.classList.remove("modal-open");
  bigImg.src = "";
  clearDrawCanvas();
  drawMode = false;
  drawCanvas.classList.remove("draw-mode");
}
function prevImg() {
  resetImgTransform();
  clearDrawCanvas();
  currentIndex--;
  if (currentIndex < 0) currentIndex = allImgs.length - 1;
  while (!allImgs[currentIndex].src || allImgs[currentIndex].src.endsWith('/')) {
    currentIndex--;
    if (currentIndex < 0) currentIndex = allImgs.length - 1;
  }
  bigImg.src = allImgs[currentIndex].src;
  loadingTip.style.display = "block";
  bigImg.onload = () => {
    loadingTip.style.display = "none";
    setTimeout(syncCanvasPosition, 100);
  };
}
function nextImg() {
  resetImgTransform();
  clearDrawCanvas();
  currentIndex++;
  if (currentIndex >= allImgs.length) currentIndex = 0;
  while (!allImgs[currentIndex].src || allImgs[currentIndex].src.endsWith('/')) {
    currentIndex++;
    if (currentIndex >= allImgs.length) currentIndex = 0;
  }
  bigImg.src = allImgs[currentIndex].src;
  loadingTip.style.display = "block";
  bigImg.onload = () => {
    loadingTip.style.display = "none";
    setTimeout(syncCanvasPosition, 100);
  };
}

closeBtn.onclick = closeModal;
prevBtn.onclick = prevImg;
nextBtn.onclick = nextImg;
modal.onclick = (e) => {
  if (e.target === modal || e.target.classList.contains("modal-content")) closeModal();
};
document.addEventListener("keydown", e => {
  if (!modal.classList.contains("active")) return;
  if (e.key === "Escape") closeModal();
  if (e.key === "ArrowLeft") prevImg();
  if (e.key === "ArrowRight") nextImg();
});

// 鼠标滚轮缩放
bigImg.addEventListener("wheel", e => {
  e.preventDefault();
  const zoomSpeed = 0.07;
  const oldScale = scale;
  scale += e.deltaY < 0 ? zoomSpeed : -zoomSpeed;
  scale = Math.max(0.4, Math.min(4, scale));
  const rect = bigImg.getBoundingClientRect();
  const mouseX = e.clientX - rect.left;
  const mouseY = e.clientY - rect.top;
  offsetX -= mouseX * (scale - oldScale);
  offsetY -= mouseY * (scale - oldScale);
  updateImgTransform();
});

// 鼠标拖拽
bigImg.addEventListener("mousedown", e => {
  if (drawMode) return;
  isDrag = true;
  dragStartX = e.clientX - offsetX;
  dragStartY = e.clientY - offsetY;
});
document.addEventListener("mousemove", e => {
  if (!isDrag || drawMode) return;
  offsetX = e.clientX - dragStartX;
  offsetY = e.clientY - dragStartY;
  updateImgTransform();
});
document.addEventListener("mouseup", () => isDrag = false);
bigImg.addEventListener("dblclick", resetImgTransform);

// 触摸缩放拖拽
bigImg.addEventListener("touchstart", e => {
  if (drawMode) return;
  if (e.touches.length === 1) {
    isDrag = true;
    dragStartX = e.touches[0].clientX - offsetX;
    dragStartY = e.touches[0].clientY - offsetY;
  } else if (e.touches.length === 2) {
    isDrag = false;
    const t1 = e.touches[0], t2 = e.touches[1];
    touchStartDist = Math.hypot(t2.clientX - t1.clientX, t2.clientY - t1.clientY);
    touchCenterX = (t1.clientX + t2.clientX) / 2;
    touchCenterY = (t1.clientY + t2.clientY) / 2;
  }
});
bigImg.addEventListener("touchmove", e => {
  if (drawMode) return;
  e.preventDefault();
  if (e.touches.length === 1 && isDrag) {
    offsetX = e.touches[0].clientX - dragStartX;
    offsetY = e.touches[0].clientY - dragStartY;
    updateImgTransform();
  } else if (e.touches.length === 2) {
    const t1 = e.touches[0], t2 = e.touches[1];
    const dist = Math.hypot(t2.clientX - t1.clientX, t2.clientY - t1.clientY);
    const oldScale = scale;
    scale += (dist - touchStartDist) * 0.0012;
    scale = Math.max(0.4, Math.min(4, scale));
    offsetX -= (touchCenterX - (t1.clientX + t2.clientX) / 2) * (scale - oldScale);
    offsetY -= (touchCenterY - (t1.clientY + t2.clientY) / 2) * (scale - oldScale);
    touchStartDist = dist;
    touchCenterX = (t1.clientX + t2.clientX) / 2;
    touchCenterY = (t1.clientY + t2.clientY) / 2;
    updateImgTransform();
  }
});
bigImg.addEventListener("touchend", () => isDrag = false);

//绘画逻辑
function drawStart(x, y) {
  isDrawing = true;
  lastDrawX = x;
  lastDrawY = y;
  drawCtx.beginPath();
  drawCtx.moveTo(x, y);
  if (isEraser) {
    drawCtx.globalCompositeOperation = "destination-out";
    drawCtx.lineWidth = lineWidth * 3;
  } else {
    drawCtx.globalCompositeOperation = "source-over";
    drawCtx.strokeStyle = drawColor;
    drawCtx.lineWidth = lineWidth;
  }
}
function drawMove(x, y) {
  if (!isDrawing) return;
  drawCtx.lineTo(x, y);
  drawCtx.stroke();
  lastDrawX = x;
  lastDrawY = y;
}
function drawEnd() {
  if (!isDrawing) return;
  isDrawing = false;
  drawHistory.push(drawCtx.getImageData(0, 0, drawCanvas.width, drawCanvas.height));
}

// 触摸绘画绑定
const touchOpt = { passive: false };
drawCanvas.addEventListener("touchstart", e => {
  if (!drawMode) return;
  e.preventDefault();
  const p = getDrawGlobalPos(e.touches[0].clientX, e.touches[0].clientY);
  drawStart(p.x, p.y);
}, touchOpt);
drawCanvas.addEventListener("touchmove", e => {
  if (!drawMode || !isDrawing) return;
  e.preventDefault();
  const p = getDrawGlobalPos(e.touches[0].clientX, e.touches[0].clientY);
  drawMove(p.x, p.y);
}, touchOpt);
drawCanvas.addEventListener("touchend", drawEnd, touchOpt);
drawCanvas.addEventListener("touchcancel", drawEnd, touchOpt);

// 鼠标绘画绑定
drawCanvas.addEventListener("mousedown", e => {
  if (!drawMode) return;
  const p = getDrawGlobalPos(e.clientX, e.clientY);
  drawStart(p.x, p.y);
});
drawCanvas.addEventListener("mousemove", e => {
  if (!drawMode || !isDrawing) return;
  const p = getDrawGlobalPos(e.clientX, e.clientY);
  drawMove(p.x, p.y);
});
drawCanvas.addEventListener("mouseup", drawEnd);
drawCanvas.addEventListener("mouseleave", drawEnd);

// 工具栏逻辑：画笔点击切换开启/关闭
const drawTool = document.getElementById("drawTool");
const eraserTool = document.getElementById("eraserTool");
drawTool.onclick = () => {
  if(drawMode && !isEraser){
      //再次点击关闭画笔
      drawMode = false;
      drawCanvas.classList.remove("draw-mode");
      drawTool.classList.remove("active");
  }else{
      drawMode = true;
      drawCanvas.classList.add("draw-mode");
      isEraser = false;
      drawTool.classList.add("active");
      eraserTool.classList.remove("active");
  }
};
eraserTool.onclick = () => {
  if(drawMode && isEraser){
      //再次点击关闭橡皮
      drawMode = false;
      drawCanvas.classList.remove("draw-mode");
      eraserTool.classList.remove("active");
  }else{
      drawMode = true;
      drawCanvas.classList.add("draw-mode");
      isEraser = true;
      eraserTool.classList.add("active");
      drawTool.classList.remove("active");
  }
};
// 颜色选择
document.querySelectorAll(".color-box").forEach(box => {
  box.onclick = () => {
    drawColor = box.dataset.color;
    document.querySelectorAll(".color-box").forEach(b => b.classList.remove("active"));
    box.classList.add("active");
  };
});

// 撤销绘制
document.getElementById("undoDraw").onclick = () => {
  if (drawHistory.length === 0) return;
  drawHistory.pop();
  drawCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
  if (drawHistory.length > 0) drawCtx.putImageData(drawHistory[drawHistory.length - 1], 0, 0);
};

// ======================== 【修复版裁剪模块】 ========================
document.getElementById("cropTool").onclick = function(){
    cropModal.classList.add("active");
    cropOpen = true;
    saveEditBtn.disabled = true;
    const img = new Image();
    img.src = bigImg.src;
    img.onload = function(){
        cropCanvas.width = img.width;
        cropCanvas.height = img.height;
        cropCtx.drawImage(img,0,0);
        // 默认选区使用像素而非百分比，避免布局错乱
        const cw = cropCanvas.offsetWidth;
        const ch = cropCanvas.offsetHeight;
        const pad = Math.min(cw,ch)*0.15;
        cropSelector.style.left = pad + "px";
        cropSelector.style.top = pad + "px";
        cropSelector.style.width = (cw - pad*2) + "px";
        cropSelector.style.height = (ch - pad*2) + "px";
    }
}

// 获取画布内相对坐标
function getCropPoint(e){
    const rect = cropCanvas.getBoundingClientRect();
    if(e.touches){
        return {
            x: e.touches[0].clientX - rect.left,
            y: e.touches[0].clientY - rect.top
        }
    }else{
        return {
            x: e.clientX - rect.left,
            y: e.clientY - rect.top
        }
    }
}
// 更新选区位置，限制不超出画布
function renderCropBox(start, now){
    const canvasRect = cropCanvas.getBoundingClientRect();
    let x1 = Math.max(0, Math.min(start.x, now.x));
    let y1 = Math.max(0, Math.min(start.y, now.y));
    let x2 = Math.min(canvasRect.width, Math.max(start.x, now.x));
    let y2 = Math.min(canvasRect.height, Math.max(start.y, now.y));

    cropSelector.style.left = x1 + "px";
    cropSelector.style.top = y1 + "px";
    cropSelector.style.width = (x2 - x1) + "px";
    cropSelector.style.height = (y2 - y1) + "px";
}

//鼠标拖拽选区
cropCanvas.onmousedown = function(e){
    cropActive = true;
    cropStart = getCropPoint(e);
}
cropCanvas.onmousemove = function(e){
    if(!cropActive) return;
    renderCropBox(cropStart, getCropPoint(e));
}
cropCanvas.onmouseup = ()=> cropActive = false;
cropCanvas.onmouseleave = ()=> cropActive = false;

//触屏拖拽选区
cropCanvas.addEventListener("touchstart",e=>{
    e.preventDefault();
    cropActive = true;
    cropStart = getCropPoint(e);
},{passive:false});
cropCanvas.addEventListener("touchmove",e=>{
    e.preventDefault();
    if(!cropActive) return;
    renderCropBox(cropStart, getCropPoint(e));
},{passive:false});
cropCanvas.addEventListener("touchend",()=>cropActive=false);
cropCanvas.addEventListener("touchcancel",()=>cropActive=false);

//取消裁剪
document.getElementById("cancelCrop").onclick = function(){
    cropModal.classList.remove("active");
    cropOpen = false;
    saveEditBtn.disabled = false;
}

//【核心修复：确认裁剪按钮逻辑】
document.getElementById("confirmCrop").onclick = function(){
    //1. 获取裁剪框相对于cropCanvas可视区域的位置
    const canvasDisplay = cropCanvas.getBoundingClientRect();
    const boxDisplay = cropSelector.getBoundingClientRect();

    // 裁剪框在画布内的相对坐标
    const cropX = boxDisplay.left - canvasDisplay.left;
    const cropY = boxDisplay.top - canvasDisplay.top;
    const cropW = boxDisplay.width;
    const cropH = boxDisplay.height;

    // 最小选区保护，防止框太小裁剪失败
    if(cropW < 20 || cropH < 20){
        alert("裁剪区域过小，请拉大选区");
        return;
    }

    // 可视画布尺寸 → 原图真实像素比例
    const scaleX = cropCanvas.width / canvasDisplay.width;
    const scaleY = cropCanvas.height / canvasDisplay.height;

    // 映射到原图像素坐标
    const realX = cropX * scaleX;
    const realY = cropY * scaleY;
    const realW = cropW * scaleX;
    const realH = cropH * scaleY;

    // 创建裁剪画布
    const tempCanvas = document.createElement("canvas");
    tempCanvas.width = realW;
    tempCanvas.height = realH;
    const tempCtx = tempCanvas.getContext("2d");

    // 裁剪绘制
    tempCtx.drawImage(
        cropCanvas,
        realX, realY, realW, realH,
        0, 0, realW, realH
    );

    // 输出图片
    editFinalImg = tempCanvas.toDataURL("image/png");
    // 关闭裁剪弹窗
    cropModal.classList.remove("active");
    cropOpen = false;
    saveEditBtn.disabled = false;
    // 打开保存预览
    openSavePreview();
}
// ======================== 裁剪模块结束 ========================
// ============【图片保存】============
document.getElementById("saveEdit").onclick = function() {
  openSavePreview();
};
function openSavePreview() {
  if(!editFinalImg){
      const merge = document.createElement("canvas");
      const mctx = merge.getContext("2d");
      const img = new Image();
      img.src = bigImg.src;
      img.crossOrigin = "anonymous";
      img.onload = () => {
        merge.width = img.width;
        merge.height = img.height;
        mctx.drawImage(img, 0, 0);
        mctx.drawImage(drawCanvas, 0,0,img.width,img.height);
        editFinalImg = merge.toDataURL("image/png");
        saveImg.src = editFinalImg;
        saveModal.classList.add("active");
      };
  }else{
      saveImg.src = editFinalImg;
      saveModal.classList.add("active");
  }
}
document.getElementById("closeSave").onclick = () => {
    saveModal.classList.remove("active");
    editFinalImg = null;
};

allImgs.forEach((img, idx) => {
  if (!img.src || img.src.endsWith('/')) {
    img.style.cursor = "default";
    img.style.opacity = "0.35";
    return;
  }
  img.onclick = () => openPreview(idx);
});

// 返回顶部按钮
const backTopBtn = document.getElementById("backTopBtn");
backTopBtn.onmouseover = ()=> backTopBtn.style.background="linear-gradient(135deg,var(--primary-deep),var(--pink-deep))";
backTopBtn.onmouseout = ()=> backTopBtn.style.background="linear-gradient(135deg,var(--primary),var(--pink))";
window.addEventListener("scroll", () => {
  backTopBtn.style.opacity = window.scrollY > 300 ? "1" : "0";
  backTopBtn.style.visibility = window.scrollY > 300 ? "visible" : "hidden";
});
backTopBtn.onclick = () => window.scrollTo({ top: 0, behavior: "smooth" });

// 微信滑动优化
if(isWeChatBrowser()){
  const modalWrap = document.querySelector(".modal-content");
  modalWrap.addEventListener("touchmove", e=>{
    if(e.touches.length === 1) e.preventDefault();
  },{passive:false})
}
</script>
