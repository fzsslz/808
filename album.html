<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>班级相册</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            transition: background 0.3s, color 0.3s;
        }
        body {
            padding: 20px;
            background: #f5f7fa;
            font-family: "Microsoft YaHei", sans-serif;
        }
        body.dark {
            background: #1a1a1a;
        }
        body.dark h1 {
            color: #fff;
        }
        body.dark .back-btn {
            background: #0E4BDB;
        }
        body.dark .album img {
            box-shadow: 0 2px 8px rgba(255,255,255,0.1);
        }
        header {
            text-align: center;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 32px;
            color: #333;
        }
        .back-btn {
            display: inline-block;
            margin: 0 auto 20px;
            padding: 10px 20px;
            background: #1677ff;
            color: #fff;
            border-radius: 8px;
            text-decoration: none;
            font-size: 16px;
        }
        .album {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 15px;
            max-width: 1200px;
            margin: 0 auto;
        }
        @media (max-width: 400px) {
            .album {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        .album img {
            width: 100%;
            height: 160px;
            object-fit: cover;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            transition: transform 0.3s;
            cursor: pointer;
        }
        .album img:hover {
            transform: scale(1.05);
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.92);
            z-index: 9999;
            overflow: hidden;
        }
        body.modal-open {
            overflow: hidden;
        }
        .modal.active {
            display: block;
        }
        .modal-content {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #bigImg {
            max-width: 92vw;
            max-height: 92vh;
            border-radius: 8px;
            box-shadow: 0 0 30px rgba(255,255,255,0.2);
            cursor: grab;
            touch-action: none;
            transform-origin: center center;
        }
        #bigImg:active {
            cursor: grabbing;
        }
        .loading-tip {
            color: #fff;
            font-size: 18px;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
        .close-modal-btn {
            position: fixed;
            top: 20px;
            right: 30px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(255,255,255,0.2);
            color: #fff;
            border: none;
            font-size: 24px;
            cursor: pointer;
            z-index: 10000;
        }
        .close-modal-btn:hover {
            background: rgba(255,255,255,0.4);
        }
        .switch-btn {
            position: fixed;
            top: 50%;
            transform: translateY(-50%);
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: rgba(255,255,255,0.2);
            color: #fff;
            border: none;
            font-size: 22px;
            cursor: pointer;
            z-index: 10000;
        }
        .switch-btn:hover {
            background: rgba(255,255,255,0.4);
        }
        .prev-btn { left: 20px; }
        .next-btn { right: 20px; }

        .edit-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(0,0,0,0.7);
            display: none;
            padding: 12px 16px;
            z-index: 10001;
        }
        .modal.active .edit-bar {
            display: flex;
            gap: 10px;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
        }
        .edit-bar button {
            padding: 8px 12px;
            border: none;
            border-radius: 6px;
            background: #fff;
            color: #222;
            font-size: 14px;
            cursor: pointer;
        }
        .edit-bar button.active {
            background: #1677ff;
            color: white;
        }
        .color-box {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            border: 2px solid #fff;
            cursor: pointer;
        }
        .color-box.active {
            box-shadow: 0 0 0 2px #1677ff;
        }
        /* 画笔滑块样式 */
        .slider-wrap{
            display:flex;
            align-items:center;
            gap:8px;
            background:#ffffff22;
            padding:4px 10px;
            border-radius:6px;
        }
        #lineSlider{
            width:120px;
        }
        .size-label{
            color:#fff;
            font-size:13px;
            min-width:32px;
        }
        /* 修复画布层级，精准贴合大图，跟随缩放拖拽 */
        #drawCanvas {
            position: absolute;
            pointer-events: none;
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
            top: 0;
            left: 0;
        }
        #drawCanvas.draw-mode {
            pointer-events: auto;
        }
        .crop-box {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.85);
            z-index: 10002;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .crop-box.active {
            display: flex;
        }
        .crop-container{
            position:relative;
        }
        .crop-canvas {
            max-width: 90vw;
            max-height: 70vh;
            border: 2px solid white;
        }
        /* 裁剪选区框 */
        #cropSelector{
            position:absolute;
            border:2px dashed #fff;
            box-shadow: 0 0 0 9999px rgba(0,0,0,0.45);
        }
        .crop-actions {
            margin-top: 15px;
            display: flex;
            gap: 12px;
        }
        .crop-actions button {
            padding: 9px 20px;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            cursor: pointer;
        }
        .save-preview {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.95);
            z-index: 10003;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            padding: 20px;
        }
        .save-preview.active {
            display: flex;
        }
        .save-tip {
            color: white;
            margin-top: 12px;
            font-size: 15px;
        }
        #saveImg {
            max-width: 90vw;
            max-height: 75vh;
        }
        #closeSave {
            margin-top: 15px;
            padding: 8px 22px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
    </style>
</head>

<script>
function isWeChatBrowser() {
    return /MicroMessenger/i.test(navigator.userAgent);
}
(function(){
  const saveTheme = localStorage.getItem("siteTheme");
  const darkBtn = document.getElementById("darkBtn");
  if(saveTheme === "dark"){
    document.body.classList.add("dark");
    darkBtn.innerText = "浅色模式";
  }
})();
function toggleDark(){
  const body = document.body;
  const btn = document.getElementById("darkBtn");
  body.classList.toggle("dark");
  const isDark = body.classList.contains("dark");
  btn.innerText = isDark ? "浅色模式" : "🌙 深色模式";
  localStorage.setItem("siteTheme", isDark ? "dark" : "light");
}

const imgWrap = document.getElementById("imgList");
const allImgs = Array.from(imgWrap.querySelectorAll(".album img"));
const modal = document.getElementById('imgModal');
const bigImg = document.getElementById('bigImg');
const loadingTip = document.getElementById('loadingTip');
const closeBtn = document.getElementById('closeBtn');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const drawCanvas = document.getElementById("drawCanvas");
const drawCtx = drawCanvas.getContext("2d");
const cropModal = document.getElementById("cropModal");
const cropCanvas = document.getElementById("cropCanvas");
const cropCtx = cropCanvas.getContext("2d");
const cropSelector = document.getElementById("cropSelector");
const saveModal = document.getElementById("saveModal");
const saveImg = document.getElementById("saveImg");

let currentIndex = 0;
let scale = 1;
let offsetX = 0;
let offsetY = 0;
let isDrag = false;
let dragStartX = 0, dragStartY = 0;
let touchStartDist = 0;
let touchCenterX = 0, touchCenterY = 0;

let drawHistory = [];
let isDrawing = false;
let drawMode = false;
let drawColor = "#ff3333";
let lineWidth = 8;
let isEraser = false;
const dpr = window.devicePixelRatio || 1;
let lastDrawX = 0, lastDrawY = 0;
let editFinalImg = null;

//裁剪全局变量
let cropStartX = 0, cropStartY = 0;
let cropIsDraw = false;

//画笔粗细滑块绑定
const lineSlider = document.getElementById("lineSlider");
const sizeVal = document.getElementById("sizeVal");
lineSlider.oninput = function(){
    lineWidth = Number(this.value);
    sizeVal.innerText = lineWidth;
}

// 图片缩放拖拽实时同步画布位置大小
function syncCanvasPosition() {
  const imgRect = bigImg.getBoundingClientRect();
  drawCanvas.style.left = imgRect.left + "px";
  drawCanvas.style.top = imgRect.top + "px";
  drawCanvas.style.width = imgRect.width + "px";
  drawCanvas.style.height = imgRect.height + "px";
  drawCanvas.width = imgRect.width * dpr;
  drawCanvas.height = imgRect.height * dpr;
  drawCtx.setTransform(1,0,0,1,0,0);
  drawCtx.scale(dpr, dpr);
  drawCtx.lineCap = "round";
  drawCtx.lineJoin = "round";
}

function updateImgTransform() {
  bigImg.style.transform = `translate(${offsetX}px, ${offsetY}px) scale(${scale})`;
  syncCanvasPosition();
}
function resetImgTransform() {
  scale = 1;
  offsetX = 0;
  offsetY = 0;
  updateImgTransform();
}
function clearDrawCanvas() {
  drawCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
  drawHistory = [];
}

// 精准坐标转换
function getDrawGlobalPos(clientX, clientY) {
  const canvasRect = drawCanvas.getBoundingClientRect();
  return {
    x: clientX - canvasRect.left,
    y: clientY - canvasRect.top
  };
}

function openPreview(index) {
  resetImgTransform();
  clearDrawCanvas();
  drawMode = false;
  drawCanvas.classList.remove("draw-mode");
  document.querySelectorAll(".edit-bar button").forEach(b => b.classList.remove("active"));
  document.querySelectorAll(".color-box").forEach(c => c.classList.remove("active"));
  document.querySelector(`.color-box[data-color="${drawColor}"]`)?.classList.add("active");

  currentIndex = index;
  const targetImg = allImgs[currentIndex];
  loadingTip.style.display = "block";
  modal.classList.add('active');
  document.body.classList.add("modal-open");
  bigImg.src = targetImg.src;
  bigImg.onload = () => {
    loadingTip.style.display = "none";
    setTimeout(syncCanvasPosition, 100);
  };
}
function closeModal() {
  modal.classList.remove('active');
  document.body.classList.remove("modal-open");
  bigImg.src = "";
  clearDrawCanvas();
  drawMode = false;
  drawCanvas.classList.remove("draw-mode");
}
function prevImg() {
  resetImgTransform();
  clearDrawCanvas();
  currentIndex--;
  if (currentIndex < 0) currentIndex = allImgs.length - 1;
  while (!allImgs[currentIndex].src || allImgs[currentIndex].src.endsWith('/')) {
    currentIndex--;
    if (currentIndex < 0) currentIndex = allImgs.length - 1;
  }
  bigImg.src = allImgs[currentIndex].src;
  loadingTip.style.display = "block";
  bigImg.onload = () => {
    loadingTip.style.display = "none";
    setTimeout(syncCanvasPosition, 100);
  };
}
function nextImg() {
  resetImgTransform();
  clearDrawCanvas();
  currentIndex++;
  if (currentIndex >= allImgs.length) currentIndex = 0;
  while (!allImgs[currentIndex].src || allImgs[currentIndex].src.endsWith('/')) {
    currentIndex++;
    if (currentIndex >= allImgs.length) currentIndex = 0;
  }
  bigImg.src = allImgs[currentIndex].src;
  loadingTip.style.display = "block";
  bigImg.onload = () => {
    loadingTip.style.display = "none";
    setTimeout(syncCanvasPosition, 100);
  };
}

closeBtn.onclick = closeModal;
prevBtn.onclick = prevImg;
nextBtn.onclick = nextImg;
modal.onclick = (e) => {
  if (e.target === modal || e.target.classList.contains("modal-content")) closeModal();
};
document.addEventListener("keydown", e => {
  if (!modal.classList.contains("active")) return;
  if (e.key === "Escape") closeModal();
  if (e.key === "ArrowLeft") prevImg();
  if (e.key === "ArrowRight") nextImg();
});

// 鼠标滚轮缩放
bigImg.addEventListener("wheel", e => {
  e.preventDefault();
  const zoomSpeed = 0.07;
  const oldScale = scale;
  scale += e.deltaY < 0 ? zoomSpeed : -zoomSpeed;
  scale = Math.max(0.4, Math.min(4, scale));
  const rect = bigImg.getBoundingClientRect();
  const mouseX = e.clientX - rect.left;
  const mouseY = e.clientY - rect.top;
  offsetX -= mouseX * (scale - oldScale);
  offsetY -= mouseY * (scale - oldScale);
  updateImgTransform();
});

// 鼠标拖拽
bigImg.addEventListener("mousedown", e => {
  if (drawMode) return;
  isDrag = true;
  dragStartX = e.clientX - offsetX;
  dragStartY = e.clientY - offsetY;
});
document.addEventListener("mousemove", e => {
  if (!isDrag || drawMode) return;
  offsetX = e.clientX - dragStartX;
  offsetY = e.clientY - dragStartY;
  updateImgTransform();
});
document.addEventListener("mouseup", () => isDrag = false);
bigImg.addEventListener("dblclick", resetImgTransform);

// 触摸缩放拖拽
bigImg.addEventListener("touchstart", e => {
  if (drawMode) return;
  if (e.touches.length === 1) {
    isDrag = true;
    dragStartX = e.touches[0].clientX - offsetX;
    dragStartY = e.touches[0].clientY - offsetY;
  } else if (e.touches.length === 2) {
    isDrag = false;
    const t1 = e.touches[0], t2 = e.touches[1];
    touchStartDist = Math.hypot(t2.clientX - t1.clientX, t2.clientY - t1.clientY);
    touchCenterX = (t1.clientX + t2.clientX) / 2;
    touchCenterY = (t1.clientY + t2.clientY) / 2;
  }
});
bigImg.addEventListener("touchmove", e => {
  if (drawMode) return;
  e.preventDefault();
  if (e.touches.length === 1 && isDrag) {
    offsetX = e.touches[0].clientX - dragStartX;
    offsetY = e.touches[0].clientY - dragStartY;
    updateImgTransform();
  } else if (e.touches.length === 2) {
    const t1 = e.touches[0], t2 = e.touches[1];
    const dist = Math.hypot(t2.clientX - t1.clientX, t2.clientY - t1.clientY);
    const oldScale = scale;
    scale += (dist - touchStartDist) * 0.0012;
    scale = Math.max(0.4, Math.min(4, scale));
    offsetX -= (touchCenterX - (t1.clientX + t2.clientX) / 2) * (scale - oldScale);
    offsetY -= (touchCenterY - (t1.clientY + t2.clientY) / 2) * (scale - oldScale);
    touchStartDist = dist;
    touchCenterX = (t1.clientX + t2.clientX) / 2;
    touchCenterY = (t1.clientY + t2.clientY) / 2;
    updateImgTransform();
  }
});
bigImg.addEventListener("touchend", () => isDrag = false);

//绘画逻辑
function drawStart(x, y) {
  isDrawing = true;
  lastDrawX = x;
  lastDrawY = y;
  drawCtx.beginPath();
  drawCtx.moveTo(x, y);
  if (isEraser) {
    drawCtx.globalCompositeOperation = "destination-out";
    drawCtx.lineWidth = lineWidth * 3;
  } else {
    drawCtx.globalCompositeOperation = "source-over";
    drawCtx.strokeStyle = drawColor;
    drawCtx.lineWidth = lineWidth;
  }
}
function drawMove(x, y) {
  if (!isDrawing) return;
  drawCtx.lineTo(x, y);
  drawCtx.stroke();
  lastDrawX = x;
  lastDrawY = y;
}
function drawEnd() {
  if (!isDrawing) return;
  isDrawing = false;
  drawHistory.push(drawCtx.getImageData(0, 0, drawCanvas.width, drawCanvas.height));
}

// 触摸绘画绑定
const touchOpt = { passive: false };
drawCanvas.addEventListener("touchstart", e => {
  if (!drawMode) return;
  e.preventDefault();
  const p = getDrawGlobalPos(e.touches[0].clientX, e.touches[0].clientY);
  drawStart(p.x, p.y);
}, touchOpt);
drawCanvas.addEventListener("touchmove", e => {
  if (!drawMode || !isDrawing) return;
  e.preventDefault();
  const p = getDrawGlobalPos(e.touches[0].clientX, e.touches[0].clientY);
  drawMove(p.x, p.y);
}, touchOpt);
drawCanvas.addEventListener("touchend", drawEnd, touchOpt);
drawCanvas.addEventListener("touchcancel", drawEnd, touchOpt);

// 鼠标绘画绑定
drawCanvas.addEventListener("mousedown", e => {
  if (!drawMode) return;
  const p = getDrawGlobalPos(e.clientX, e.clientY);
  drawStart(p.x, p.y);
});
drawCanvas.addEventListener("mousemove", e => {
  if (!drawMode || !isDrawing) return;
  const p = getDrawGlobalPos(e.clientX, e.clientY);
  drawMove(p.x, p.y);
});
drawCanvas.addEventListener("mouseup", drawEnd);
drawCanvas.addEventListener("mouseleave", drawEnd);

// 工具栏逻辑
const drawTool = document.getElementById("drawTool");
const eraserTool = document.getElementById("eraserTool");
drawTool.onclick = () => {
  drawMode = true;
  drawCanvas.classList.add("draw-mode");
  isEraser = false;
  drawTool.classList.add("active");
  eraserTool.classList.remove("active");
};
eraserTool.onclick = () => {
  drawMode = true;
  drawCanvas.classList.add("draw-mode");
  isEraser = true;
  eraserTool.classList.add("active");
  drawTool.classList.remove("active");
};
// 颜色选择
document.querySelectorAll(".color-box").forEach(box => {
  box.onclick = () => {
    drawColor = box.dataset.color;
    document.querySelectorAll(".color-box").forEach(b => b.classList.remove("active"));
    box.classList.add("active");
  };
});

// 撤销绘制
document.getElementById("undoDraw").onclick = () => {
  if (drawHistory.length === 0) return;
  drawHistory.pop();
  drawCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
  if (drawHistory.length > 0) drawCtx.putImageData(drawHistory[drawHistory.length - 1], 0, 0);
};

// ============【修复裁剪模块】============
document.getElementById("cropTool").onclick = () => {
  cropModal.classList.add("active");
  const img = new Image();
  img.src = bigImg.src;
  img.onload = () => {
    cropCanvas.width = img.width;
    cropCanvas.height = img.height;
    cropCtx.drawImage(img, 0, 0);
    cropSelector.style.width = "60%";
    cropSelector.style.height = "60%";
    cropSelector.style.left = "20%";
    cropSelector.style.top = "20%";
  };
};

function updateCropBox(startX, startY, curX, curY) {
  let x = Math.min(startX, curX);
  let y = Math.min(startY, curY);
  let w = Math.abs(curX - startX);
  let h = Math.abs(curY - startY);
  const maxW = cropCanvas.clientWidth;
  const maxH = cropCanvas.clientHeight;
  x = Math.max(0, Math.min(x, maxW - w));
  y = Math.max(0, Math.min(y, maxH - h));
  cropSelector.style.left = x + "px";
  cropSelector.style.top = y + "px";
  cropSelector.style.width = w + "px";
  cropSelector.style.height = h + "px";
}

cropCanvas.onmousedown = (e)=>{
    cropIsDraw = true;
    const rect = cropCanvas.getBoundingClientRect();
    cropStartX = e.clientX - rect.left;
    cropStartY = e.clientY - rect.top;
}
cropCanvas.onmousemove = (e)=>{
    if(!cropIsDraw) return;
    const rect = cropCanvas.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const my = e.clientY - rect.top;
    updateCropBox(cropStartX, cropStartY, mx, my);
}
cropCanvas.onmouseup = ()=> cropIsDraw = false;
cropCanvas.onmouseleave = ()=> cropIsDraw = false;

document.getElementById("cancelCrop").onclick = () => {
    cropModal.classList.remove("active");
};
document.getElementById("confirmCrop").onclick = () => {
    const selRect = cropSelector.getBoundingClientRect();
    const canvasRect = cropCanvas.getBoundingClientRect();
    const scaleX = cropCanvas.width / canvasRect.width;
    const scaleY = cropCanvas.height / canvasRect.height;
    const sx = (selRect.left - canvasRect.left) * scaleX;
    const sy = (selRect.top - canvasRect.top) * scaleY;
    const sw = selRect.width * scaleX;
    const sh = selRect.height * scaleY;

    const temp = document.createElement("canvas");
    temp.width = sw;
    temp.height = sh;
    const tctx = temp.getContext("2d");
    tctx.drawImage(cropCanvas, sx, sy, sw, sh, 0, 0, sw, sh);
    editFinalImg = temp.toDataURL("image/png");
    cropModal.classList.remove("active");
    openSavePreview();
};

// ============【修复图片保存，兼容微信】============
document.getElementById("saveEdit").onclick = function() {
  openSavePreview();
};
function openSavePreview() {
  const merge = document.createElement("canvas");
  const mctx = merge.getContext("2d");
  const img = new Image();
  img.src = bigImg.src;
  img.crossOrigin = "anonymous";
  img.onload = () => {
    merge.width = img.width;
    merge.height = img.height;
    mctx.drawImage(img, 0, 0);
    mctx.drawImage(drawCanvas, 0,0,img.width,img.height);
    editFinalImg = merge.toDataURL("image/png");
    saveImg.src = editFinalImg;
    saveModal.classList.add("active");
  };
}
document.getElementById("closeSave").onclick = () => saveModal.classList.remove("active");

allImgs.forEach((img, idx) => {
  if (!img.src || img.src.endsWith('/')) {
    img.style.cursor = "default";
    img.style.opacity = "0.35";
    return;
  }
  img.onclick = () => openPreview(idx);
});

// 返回顶部按钮
const backTopBtn = document.getElementById("backTopBtn");
window.addEventListener("scroll", () => {
  backTopBtn.style.opacity = window.scrollY > 300 ? "1" : "0";
  backTopBtn.style.visibility = window.scrollY > 300 ? "visible" : "hidden";
});
backTopBtn.onclick = () => window.scrollTo({ top: 0, behavior: "smooth" });

// 微信滑动优化
if(isWeChatBrowser()){
  const modalWrap = document.querySelector(".modal-content");
  modalWrap.addEventListener("touchmove", e=>{
    if(e.touches.length === 1) e.preventDefault();
  },{passive:false})
}
</script>
