<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>班级相册</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            transition: background 0.3s, color 0.3s;
        }
        body {
            padding: 20px;
            background: #f5f7fa;
            font-family: "Microsoft YaHei", sans-serif;
        }
        body.dark {
            background: #1a1a1a;
        }
        body.dark h1 {
            color: #fff;
        }
        body.dark .back-btn {
            background: #0E4BDB;
        }
        body.dark .album img {
            box-shadow: 0 2px 8px rgba(255,255,255,0.1);
        }
        header {
            text-align: center;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 32px;
            color: #333;
        }
        .back-btn {
            display: inline-block;
            margin: 0 auto 20px;
            padding: 10px 20px;
            background: #1677ff;
            color: #fff;
            border-radius: 8px;
            text-decoration: none;
            font-size: 16px;
        }
        .album {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 15px;
            max-width: 1200px;
            margin: 0 auto;
        }
        @media (max-width: 400px) {
            .album {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        .album img {
            width: 100%;
            height: 160px;
            object-fit: cover;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            transition: transform 0.3s;
            cursor: pointer;
            will-change: transform;
        }
        .album img:hover {
            transform: scale(1.05);
        }

        /* 预览弹窗 */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.92);
            z-index: 9999;
            text-align: center;
            overflow: hidden;
        }
        body.modal-open {
            overflow: hidden;
        }
        .modal.active {
            display: block;
        }
        .modal-content {
            position: relative;
            width: 100vw;
            height: calc(100vh - 120px);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #bigImg {
            max-width: 92vw;
            max-height: 92vh;
            border-radius: 8px;
            box-shadow: 0 0 30px rgba(255,255,255,0.2);
            cursor: grab;
            touch-action: none;
            will-change: transform;
        }
        #bigImg:active {
            cursor: grabbing;
        }
        .loading-tip {
            color: #fff;
            font-size: 18px;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
        .close-modal-btn {
            position: fixed;
            top: 20px;
            right: 30px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(255,255,255,0.2);
            color: #fff;
            border: none;
            font-size: 24px;
            cursor: pointer;
            z-index: 10000;
        }
        .close-modal-btn:hover {
            background: rgba(255,255,255,0.4);
        }
        .switch-btn {
            position: fixed;
            top: 50%;
            transform: translateY(-50%);
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: rgba(255,255,255,0.2);
            color: #fff;
            border: none;
            font-size: 22px;
            cursor: pointer;
            z-index: 10000;
        }
        .switch-btn:hover {
            background: rgba(255,255,255,0.4);
        }
        .prev-btn { left: 20px; }
        .next-btn { right: 20px; }

        /* 底部编辑工具栏 */
        .edit-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 110px;
            background: rgba(0,0,0,0.7);
            display: none;
            padding: 10px;
            z-index: 10001;
        }
        .modal.active .edit-bar {
            display: flex;
            gap: 8px;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
        }
        .edit-bar button {
            padding: 8px 12px;
            border: none;
            border-radius: 6px;
            background: #fff;
            color: #222;
            font-size: 14px;
            cursor: pointer;
        }
        .edit-bar button.active {
            background: #1677ff;
            color: white;
        }
        .color-box {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            border: 2px solid #fff;
            cursor: pointer;
        }
        .color-box.active {
            box-shadow: 0 0 0 2px #1677ff;
        }
        /* 涂鸦画布覆盖原图 + 移动端手势锁定核心修复 */
        #drawCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
            transform: translateZ(0);
        }
        #drawCanvas.draw-mode {
            pointer-events: auto;
        }
        /* 裁剪弹窗 */
        .crop-box {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.85);
            z-index: 10002;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .crop-box.active {
            display: flex;
        }
        .crop-canvas {
            max-width: 90vw;
            max-height: 70vh;
            border: 2px solid white;
        }
        .crop-actions {
            margin-top: 15px;
            display: flex;
            gap: 12px;
        }
        .crop-actions button {
            padding: 9px 20px;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            cursor: pointer;
        }
        /* 保存预览弹窗 */
        .save-preview {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.95);
            z-index: 10003;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            padding: 20px;
        }
        .save-preview.active {
            display: flex;
        }
        .save-tip {
            color: white;
            margin-top: 12px;
            font-size: 15px;
        }
        #saveImg {
            max-width: 90vw;
            max-height: 75vh;
        }
        #closeSave {
            margin-top: 15px;
            padding: 8px 22px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
    </style>
</head>

<script>
// 判断微信环境
function isWeChatBrowser() {
    return /MicroMessenger/i.test(navigator.userAgent);
}

// 深色模式初始化
(function(){
  const saveTheme = localStorage.getItem("siteTheme");
  const darkBtn = document.getElementById("darkBtn");
  if(saveTheme === "dark"){
    document.body.classList.add("dark");
    darkBtn.innerText = "浅色模式";
  }
})();
function toggleDark(){
  const body = document.body;
  const btn = document.getElementById("darkBtn");
  body.classList.toggle("dark");
  const isDark = body.classList.contains("dark");
  btn.innerText = isDark ? "浅色模式" : "🌙 深色模式";
  localStorage.setItem("siteTheme", isDark ? "dark" : "light");
}

// 基础DOM
const imgWrap = document.getElementById("imgList");
const allImgs = Array.from(imgWrap.querySelectorAll(".album img"));
const modal = document.getElementById('imgModal');
const bigImg = document.getElementById('bigImg');
const loadingTip = document.getElementById('loadingTip');
const closeBtn = document.getElementById('closeBtn');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const drawCanvas = document.getElementById("drawCanvas");
const drawCtx = drawCanvas.getContext("2d");
const cropModal = document.getElementById("cropModal");
const cropCanvas = document.getElementById("cropCanvas");
const cropCtx = cropCanvas.getContext("2d");
const saveModal = document.getElementById("saveModal");
const saveImg = document.getElementById("saveImg");

// 全局状态
let currentIndex = 0;
let scale = 1;
let offsetX = 0;
let offsetY = 0;
let isDrag = false;
let dragStartX = 0, dragStartY = 0;
let touchStartDist = 0;
let touchCenterX = 0, touchCenterY = 0;

// 绘画状态
let drawHistory = [];
let isDrawing = false;
let drawMode = false;
let drawColor = "#ff3333";
let lineWidth = 8;
let isEraser = false;
const dpr = window.devicePixelRatio || 1;
let lastDrawX = 0, lastDrawY = 0;
let editFinalImg = null;

// 刷新图片+画布变换
function updateImgTransform() {
  bigImg.style.transform = `translate(${offsetX}px, ${offsetY}px) scale(${scale})`;
  drawCanvas.style.transform = `translate(${offsetX}px, ${offsetY}px) scale(${scale})`;
}

// 重置缩放偏移
function resetImgTransform() {
  scale = 1;
  offsetX = 0;
  offsetY = 0;
  updateImgTransform();
}

// 清空绘画记录
function clearDrawCanvas() {
  drawCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
  drawHistory = [];
}

// 画布尺寸跟随大图实时更新（解决放大后绘画错位）
function resizeDrawCanvas() {
  const rect = bigImg.getBoundingClientRect();
  drawCanvas.width = rect.width * dpr;
  drawCanvas.height = rect.height * dpr;
  drawCanvas.style.width = rect.width + "px";
  drawCanvas.style.height = rect.height + "px";
  drawCtx.scale(dpr, dpr);
}

// 打开大图
function openPreview(index) {
  resetImgTransform();
  clearDrawCanvas();
  drawMode = false;
  drawCanvas.classList.remove("draw-mode");
  document.querySelectorAll(".edit-bar button").forEach(b => b.classList.remove("active"));
  document.querySelectorAll(".color-box").forEach(c => c.classList.remove("active"));
  document.querySelector(`.color-box[data-color="${drawColor}"]`)?.classList.add("active");

  currentIndex = index;
  const targetImg = allImgs[currentIndex];
  loadingTip.style.display = "block";
  modal.classList.add('active');
  document.body.classList.add("modal-open");
  bigImg.src = targetImg.src;
  bigImg.onload = () => {
    loadingTip.style.display = "none";
    resizeDrawCanvas();
  };
}

// 关闭预览
function closeModal() {
  modal.classList.remove('active');
  document.body.classList.remove("modal-open");
  bigImg.src = "";
  clearDrawCanvas();
  drawMode = false;
  drawCanvas.classList.remove("draw-mode");
}

// 上一张
function prevImg() {
  resetImgTransform();
  clearDrawCanvas();
  currentIndex--;
  if (currentIndex < 0) currentIndex = allImgs.length - 1;
  while (!allImgs[currentIndex].src || allImgs[currentIndex].src.endsWith('/')) {
    currentIndex--;
    if (currentIndex < 0) currentIndex = allImgs.length - 1;
  }
  bigImg.src = allImgs[currentIndex].src;
  loadingTip.style.display = "block";
  bigImg.onload = () => {
    loadingTip.style.display = "none";
    resizeDrawCanvas();
  };
}

// 下一张
function nextImg() {
  resetImgTransform();
  clearDrawCanvas();
  currentIndex++;
  if (currentIndex >= allImgs.length) currentIndex = 0;
  while (!allImgs[currentIndex].src || allImgs[currentIndex].src.endsWith('/')) {
    currentIndex++;
    if (currentIndex >= allImgs.length) currentIndex = 0;
  }
  bigImg.src = allImgs[currentIndex].src;
  loadingTip.style.display = "block";
  bigImg.onload = () => {
    loadingTip.style.display = "none";
    resizeDrawCanvas();
  };
}

// 绑定切换/关闭
closeBtn.onclick = closeModal;
prevBtn.onclick = prevImg;
nextBtn.onclick = nextImg;
modal.onclick = (e) => {
  if (e.target === modal || e.target.classList.contains("modal-content")) closeModal();
};
document.addEventListener("keydown", e => {
  if (!modal.classList.contains("active")) return;
  if (e.key === "Escape") closeModal();
  if (e.key === "ArrowLeft") prevImg();
  if (e.key === "ArrowRight") nextImg();
});

// ========== 缩放、拖拽（彻底修复放大失灵） ==========
// 鼠标滚轮缩放
bigImg.addEventListener("wheel", e => {
  e.preventDefault();
  const zoomSpeed = 0.07;
  const oldScale = scale;
  scale += e.deltaY < 0 ? zoomSpeed : -zoomSpeed;
  scale = Math.max(0.4, Math.min(4, scale));

  // 以鼠标位置为缩放锚点
  const rect = bigImg.getBoundingClientRect();
  const mouseX = e.clientX - rect.left;
  const mouseY = e.clientY - rect.top;
  offsetX -= mouseX * (scale - oldScale);
  offsetY -= mouseY * (scale - oldScale);
  updateImgTransform();
  resizeDrawCanvas();
});

// 鼠标拖拽
bigImg.addEventListener("mousedown", e => {
  if (drawMode) return;
  isDrag = true;
  dragStartX = e.clientX - offsetX;
  dragStartY = e.clientY - offsetY;
});
document.addEventListener("mousemove", e => {
  if (!isDrag || drawMode) return;
  offsetX = e.clientX - dragStartX;
  offsetY = e.clientY - dragStartY;
  updateImgTransform();
  resizeDrawCanvas();
});
document.addEventListener("mouseup", () => isDrag = false);
bigImg.addEventListener("dblclick", resetImgTransform);

// 触摸双指缩放/拖拽
bigImg.addEventListener("touchstart", e => {
  if (drawMode) return;
  if (e.touches.length === 1) {
    isDrag = true;
    dragStartX = e.touches[0].clientX - offsetX;
    dragStartY = e.touches[0].clientY - offsetY;
  } else if (e.touches.length === 2) {
    isDrag = false;
    const t1 = e.touches[0], t2 = e.touches[1];
    touchStartDist = Math.hypot(t2.clientX - t1.clientX, t2.clientY - t1.clientY);
    touchCenterX = (t1.clientX + t2.clientX) / 2;
    touchCenterY = (t1.clientY + t2.clientY) / 2;
  }
});
bigImg.addEventListener("touchmove", e => {
  if (drawMode) return;
  e.preventDefault();
  if (e.touches.length === 1 && isDrag) {
    offsetX = e.touches[0].clientX - dragStartX;
    offsetY = e.touches[0].clientY - dragStartY;
    updateImgTransform();
    resizeDrawCanvas();
  } else if (e.touches.length === 2) {
    const t1 = e.touches[0], t2 = e.touches[1];
    const dist = Math.hypot(t2.clientX - t1.clientX, t2.clientY - t1.clientY);
    const oldScale = scale;
    scale += (dist - touchStartDist) * 0.0012;
    scale = Math.max(0.4, Math.min(4, scale));
    // 双指中心锚点缩放
    offsetX -= (touchCenterX - (t1.clientX + t2.clientX) / 2) * (scale - oldScale);
    offsetY -= (touchCenterY - (t1.clientY + t2.clientY) / 2) * (scale - oldScale);
    touchStartDist = dist;
    touchCenterX = (t1.clientX + t2.clientX) / 2;
    touchCenterY = (t1.clientY + t2.clientY) / 2;
    updateImgTransform();
    resizeDrawCanvas();
  }
});
bigImg.addEventListener("touchend", () => isDrag = false);

// ========== 绘画核心【重点修复手机无线条问题】 ==========
// 转换屏幕坐标到画布内部像素
function getDrawPos(clientX, clientY) {
  const rect = drawCanvas.getBoundingClientRect();
  return {
    x: (clientX - rect.left) * dpr,
    y: (clientY - rect.top) * dpr
  };
}

// 落笔
function drawStart(x, y) {
  isDrawing = true;
  lastDrawX = x;
  lastDrawY = y;
  drawCtx.beginPath();
  drawCtx.moveTo(x, y);
  drawCtx.lineCap = "round";
  drawCtx.lineJoin = "round";
  if (isEraser) {
    drawCtx.globalCompositeOperation = "destination-out";
    drawCtx.lineWidth = lineWidth * 3 * dpr;
  } else {
    drawCtx.globalCompositeOperation = "source-over";
    drawCtx.strokeStyle = drawColor;
    drawCtx.lineWidth = lineWidth * dpr;
  }
}
// 画线
function drawMove(x, y) {
  if (!isDrawing) return;
  drawCtx.lineTo(x, y);
  drawCtx.stroke();
  lastDrawX = x;
  lastDrawY = y;
}
// 停笔保存记录
function drawEnd() {
  if (!isDrawing) return;
  isDrawing = false;
  drawHistory.push(drawCtx.getImageData(0, 0, drawCanvas.width, drawCanvas.height));
}

// 触摸绘画 关键配置 passive:false 允许阻止滚动
const touchOpt = { passive: false };
drawCanvas.addEventListener("touchstart", e => {
  if (!drawMode) return;
  e.preventDefault();
  const p = getDrawPos(e.touches[0].clientX, e.touches[0].clientY);
  drawStart(p.x, p.y);
}, touchOpt);

drawCanvas.addEventListener("touchmove", e => {
  if (!drawMode || !isDrawing) return;
  e.preventDefault();
  const p = getDrawPos(e.touches[0].clientX, e.touches[0].clientY);
  drawMove(p.x, p.y);
}, touchOpt);

drawCanvas.addEventListener("touchend", drawEnd, touchOpt);
drawCanvas.addEventListener("touchcancel", drawEnd, touchOpt);

// PC鼠标绘画
drawCanvas.addEventListener("mousedown", e => {
  if (!drawMode) return;
  const p = getDrawPos(e.clientX, e.clientY);
  drawStart(p.x, p.y);
});
drawCanvas.addEventListener("mousemove", e => {
  if (!drawMode || !isDrawing) return;
  const p = getDrawPos(e.clientX, e.clientY);
  drawMove(p.x, p.y);
});
drawCanvas.addEventListener("mouseup", drawEnd);
drawCanvas.addEventListener("mouseleave", drawEnd);

// 工具栏绑定
const drawTool = document.getElementById("drawTool");
const eraserTool = document.getElementById("eraserTool");
drawTool.onclick = () => {
  drawMode = true;
  drawCanvas.classList.add("draw-mode");
  isEraser = false;
  drawTool.classList.add("active");
  eraserTool.classList.remove("active");
};
eraserTool.onclick = () => {
  drawMode = true;
  drawCanvas.classList.add("draw-mode");
  isEraser = true;
  eraserTool.classList.add("active");
  drawTool.classList.remove("active");
};
document.querySelectorAll(".color-box").forEach(box => {
  box.onclick = () => {
    drawColor = box.dataset.color;
    document.querySelectorAll(".color-box").forEach(b => b.classList.remove("active"));
    box.classList.add("active");
  };
});
document.getElementById("undoDraw").onclick = () => {
  if (drawHistory.length === 0) return;
  drawHistory.pop();
  drawCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
  if (drawHistory.length > 0) drawCtx.putImageData(drawHistory[drawHistory.length - 1], 0, 0);
};

// 裁剪
document.getElementById("cropTool").onclick = () => {
  cropModal.classList.add("active");
  const img = new Image();
  img.src = bigImg.src;
  img.onload = () => {
    cropCanvas.width = img.width;
    cropCanvas.height = img.height;
    cropCtx.drawImage(img, 0, 0);
  };
};
document.getElementById("cancelCrop").onclick = () => cropModal.classList.remove("active");
document.getElementById("confirmCrop").onclick = () => {
  const size = Math.min(cropCanvas.width, cropCanvas.height);
  const x = (cropCanvas.width - size) / 2;
  const y = (cropCanvas.height - size) / 2;
  const temp = document.createElement("canvas");
  temp.width = size;
  temp.height = size;
  const tctx = temp.getContext("2d");
  tctx.drawImage(cropCanvas, x, y, size, size, 0, 0, size, size);
  editFinalImg = temp.toDataURL("image/png");
  cropModal.classList.remove("active");
  openSavePreview();
};

// 保存图片（增加微信提示）
document.getElementById("saveEdit").onclick = function() {
  // 微信浏览器提示
  if(isWeChatBrowser()){
    alert("微信内置浏览器存在画布安全限制，无法导出保存图片！请点击右上角【...】→在浏览器打开后重试");
    return;
  }
  openSavePreview();
};

function openSavePreview() {
  const merge = document.createElement("canvas");
  const mctx = merge.getContext("2d");
  const img = new Image();
  img.src = bigImg.src;
  img.onload = () => {
    merge.width = img.width;
    merge.height = img.height;
    mctx.drawImage(img, 0, 0);
    mctx.drawImage(drawCanvas, 0, 0, img.width, img.height);
    editFinalImg = merge.toDataURL("image/png");
    saveImg.src = editFinalImg;
    saveModal.classList.add("active");
  };
}
document.getElementById("closeSave").onclick = () => saveModal.classList.remove("active");

// 过滤空白图片点击
allImgs.forEach((img, idx) => {
  if (!img.src || img.src.endsWith('/')) {
    img.style.cursor = "default";
    img.style.opacity = "0.35";
    return;
  }
  img.onclick = () => openPreview(idx);
});

// 返回顶部
const backTopBtn = document.getElementById("backTopBtn");
window.addEventListener("scroll", () => {
  if (window.scrollY > 300) {
    backTopBtn.style.opacity = "1";
    backTopBtn.style.visibility = "visible";
  } else {
    backTopBtn.style.opacity = "0";
    backTopBtn.style.visibility = "hidden";
  }
});
backTopBtn.onclick = () => window.scrollTo({ top: 0, behavior: "smooth" });

// 微信下拉刷新拦截优化绘画体验
if(isWeChatBrowser()){
  const modalWrap = document.querySelector(".modal-content");
  modalWrap.addEventListener("touchmove", function(e){
    if(e.touches.length === 1){
      e.preventDefault();
    }
  },{passive:false})
}
</script>
</body>
