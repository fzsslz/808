<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>班级相册</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            transition: background 0.3s, color 0.3s;
        }
        body {
            padding: 20px;
            background: #f5f7fa;
            font-family: "Microsoft YaHei", sans-serif;
        }
        body.dark {
            background: #1a1a1a;
        }
        body.dark h1 {
            color: #fff;
        }
        body.dark .back-btn {
            background: #0E4BDB;
        }
        body.dark .album img {
            box-shadow: 0 2px 8px rgba(255,255,255,0.1);
        }
        header {
            text-align: center;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 32px;
            color: #333;
        }
        .back-btn {
            display: inline-block;
            margin: 0 auto 20px;
            padding: 10px 20px;
            background: #1677ff;
            color: #fff;
            border-radius: 8px;
            text-decoration: none;
            font-size: 16px;
        }
        .album {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 15px;
            max-width: 1200px;
            margin: 0 auto;
        }
        @media (max-width: 400px) {
            .album {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        .album img {
            width: 100%;
            height: 160px;
            object-fit: cover;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            transition: transform 0.3s;
            cursor: pointer;
            will-change: transform;
            transform: translateZ(0);
        }
        .album img:hover {
            transform: scale(1.05);
        }

        /* 预览弹窗 */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.92);
            z-index: 9999;
            text-align: center;
            overflow: hidden;
        }
        body.modal-open {
            overflow: hidden;
        }
        .modal.active {
            display: block;
        }
        .modal-content {
            position: relative;
            width: 100vw;
            height: calc(100vh - 120px);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #bigImg {
            max-width: 92vw;
            max-height: 92vh;
            border-radius: 8px;
            box-shadow: 0 0 30px rgba(255,255,255,0.2);
            cursor: grab;
            touch-action: pan-x pan-y pinch-zoom;
            will-change: transform, transform-origin;
            transform: translateZ(0);
            transform-origin: 0 0;
        }
        #bigImg:active {
            cursor: grabbing;
        }
        .loading-tip {
            color: #fff;
            font-size: 18px;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
        .close-modal-btn {
            position: fixed;
            top: 20px;
            right: 30px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(255,255,255,0.2);
            color: #fff;
            border: none;
            font-size: 24px;
            cursor: pointer;
            z-index: 10000;
        }
        .close-modal-btn:hover {
            background: rgba(255,255,255,0.4);
        }
        .switch-btn {
            position: fixed;
            top: 50%;
            transform: translateY(-50%);
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: rgba(255,255,255,0.2);
            color: #fff;
            border: none;
            font-size: 22px;
            cursor: pointer;
            z-index: 10000;
        }
        .switch-btn:hover {
            background: rgba(255,255,255,0.4);
        }
        .prev-btn { left: 20px; }
        .next-btn { right: 20px; }

        /* 底部编辑工具栏 */
        .edit-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 110px;
            background: rgba(0,0,0,0.7);
            display: none;
            padding: 10px;
            z-index: 10001;
        }
        .modal.active .edit-bar {
            display: flex;
            gap: 8px;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
        }
        .edit-bar button {
            padding: 8px 12px;
            border: none;
            border-radius: 6px;
            background: #fff;
            color: #222;
            font-size: 14px;
        }
        .edit-bar button.active {
            background: #1677ff;
            color: white;
        }
        .color-box {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            border: 2px solid #fff;
        }
        /* 涂鸦画布覆盖原图 */
        #drawCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        #drawCanvas.draw-mode {
            pointer-events: auto;
        }
        /* 裁剪弹窗 */
        .crop-box {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.85);
            z-index: 10002;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .crop-box.active {
            display: flex;
        }
        .crop-canvas {
            max-width: 90vw;
            max-height: 70vh;
            border: 2px solid white;
        }
        .crop-actions {
            margin-top: 15px;
            display: flex;
            gap: 12px;
        }
        .crop-actions button {
            padding: 9px 20px;
            border: none;
            border-radius: 6px;
            font-size: 15px;
        }
        /* 保存预览弹窗 */
        .save-preview {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.95);
            z-index: 10003;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            padding: 20px;
        }
        .save-preview.active {
            display: flex;
        }
        .save-tip {
            color: white;
            margin-top: 12px;
            font-size: 15px;
        }
        #saveImg {
            max-width: 90vw;
            max-height: 75vh;
        }
        #closeSave {
            margin-top: 15px;
            padding: 8px 22px;
            border: none;
            border-radius: 6px;
        }
    </style>
</head>

<script>
// 深色模式初始化
(function(){
  const saveTheme = localStorage.getItem("siteTheme");
  const darkBtn = document.getElementById("darkBtn");
  if(saveTheme === "dark"){
    document.body.classList.add("dark");
    darkBtn.innerText = "浅色模式";
  }
})();
function toggleDark(){
  const body = document.body;
  const btn = document.getElementById("darkBtn");
  body.classList.toggle("dark");
  const isDark = body.classList.contains("dark");
  btn.innerText = isDark ? "浅色模式" : "🌙 深色模式";
  localStorage.setItem("siteTheme", isDark ? "dark" : "light");
}

// 相册基础变量
const imgWrap = document.getElementById("imgList");
const allImgs = Array.from(imgWrap.querySelectorAll(".album img"));
const modal = document.getElementById('imgModal');
const bigImg = document.getElementById('bigImg');
const loadingTip = document.getElementById('loadingTip');
const closeBtn = document.getElementById('closeBtn');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
let currentIndex = 0;

// 缩放拖拽全局（高灵敏双指缩放）
let scale = 1;
let offsetX = 0;
let offsetY = 0;
let isDrag = false;
let dragStartX = 0;
let dragStartY = 0;
let touchStartDist = 0;
let touchCenterX = 0;
let touchCenterY = 0;
let rafPending = false;

// 涂鸦画布变量
const drawCanvas = document.getElementById("drawCanvas");
const drawCtx = drawCanvas.getContext("2d");
let drawHistory = [];
let isDrawing = false;
let drawMode = false;
let drawColor = "#ff3333";
let lineWidth = 6;
let isEraser = false;
const dpr = window.devicePixelRatio || 1;

// 裁剪、保存弹窗
const cropModal = document.getElementById("cropModal");
const cropCanvas = document.getElementById("cropCanvas");
const cropCtx = cropCanvas.getContext("2d");
const saveModal = document.getElementById("saveModal");
const saveImg = document.getElementById("saveImg");
let editFinalImg = null;

// 渲染图片变换
function renderTransform(){
    bigImg.style.transform = `translate(${offsetX}px, ${offsetY}px) scale(${scale})`;
    drawCanvas.style.transform = `translate(${offsetX}px, ${offsetY}px) scale(${scale})`;
    rafPending = false;
}
function scheduleRender(){
    if(!rafPending){
        requestAnimationFrame(renderTransform);
        rafPending = true;
    }
}
// 重置图片缩放偏移
function resetImgTransform() {
    scale = 1;
    offsetX = 0;
    offsetY = 0;
    scheduleRender();
}
// 清空涂鸦画布
function clearDrawCanvas(){
    drawCtx.clearRect(0,0,drawCanvas.width,drawCanvas.height);
    drawHistory = [];
}
// 初始化涂鸦画布尺寸
function initDrawCanvas(){
    const rect = bigImg.getBoundingClientRect();
    drawCanvas.width = rect.width * dpr;
    drawCanvas.height = rect.height * dpr;
    drawCanvas.style.width = rect.width + "px";
    drawCanvas.style.height = rect.height + "px";
    drawCtx.scale(dpr, dpr);
    clearDrawCanvas();
}

// 过滤空白图片
allImgs.forEach((img, idx) => {
    if(!img.src || img.src.endsWith('/')) {
        img.style.cursor = "default";
        img.style.opacity = "0.35";
        return;
    }
    img.onclick = ()=> openPreview(idx);
});

// 打开大图预览
function openPreview(index) {
    resetImgTransform();
    clearDrawCanvas();
    currentIndex = index;
    const targetImg = allImgs[currentIndex];
    loadingTip.style.display = "block";
    modal.classList.add('active');
    document.body.classList.add("modal-open");
    bigImg.src = targetImg.src;
    bigImg.onload = ()=> {
        loadingTip.style.display = "none";
        initDrawCanvas();
    };
}
// 关闭预览
function closeModal() {
    modal.classList.remove('active');
    document.body.classList.remove("modal-open");
    bigImg.src = "";
    clearDrawCanvas();
    drawMode = false;
    drawCanvas.classList.remove("draw-mode");
}
// 上一张图
function prevImg() {
    resetImgTransform();
    clearDrawCanvas();
    currentIndex--;
    if(currentIndex < 0) currentIndex = allImgs.length - 1;
    while(!allImgs[currentIndex].src || allImgs[currentIndex].src.endsWith('/')){
        currentIndex--;
        if(currentIndex <0) currentIndex = allImgs.length -1;
    }
    bigImg.src = allImgs[currentIndex].src;
    loadingTip.style.display = "block";
    bigImg.onload = ()=> {
        loadingTip.style.display = "none";
        initDrawCanvas();
    };
}
// 下一张图
function nextImg() {
    resetImgTransform();
    clearDrawCanvas();
    currentIndex++;
    if(currentIndex >= allImgs.length) currentIndex = 0;
    while(!allImgs[currentIndex].src || allImgs[currentIndex].src.endsWith('/')){
        currentIndex++;
        if(currentIndex >= allImgs.length) currentIndex = 0;
    }
    bigImg.src = allImgs[currentIndex].src;
    loadingTip.style.display = "block";
    bigImg.onload = ()=> {
        loadingTip.style.display = "none";
        initDrawCanvas();
    };
}
// 绑定切换、关闭按钮
closeBtn.onclick = closeModal;
prevBtn.onclick = prevImg;
nextBtn.onclick = nextImg;
modal.onclick = (e)=> {
    if(e.target === modal || e.target.classList.contains("modal-content")) closeModal();
}
// 键盘快捷键
document.addEventListener("keydown", (e)=>{
    if(!modal.classList.contains("active")) return;
    if(e.key === "Escape") closeModal();
    if(e.key === "ArrowLeft") prevImg();
    if(e.key === "ArrowRight") nextImg();
})

// ========== 原图缩放拖拽逻辑（高灵敏） ==========
// PC滚轮缩放
bigImg.addEventListener('wheel', (e)=>{
    e.preventDefault();
    const zoomStep = 0.08;
    if(e.deltaY < 0) scale += zoomStep;
    else scale -= zoomStep;
    scale = Math.max(0.3, Math.min(5, scale));
    scheduleRender();
})
// 鼠标拖拽
bigImg.addEventListener('mousedown', (e)=>{
    if(drawMode) return;
    isDrag = true;
    dragStartX = e.clientX - offsetX;
    dragStartY = e.clientY - offsetY;
})
document.addEventListener('mousemove', (e)=>{
    if(!isDrag || drawMode) return;
    offsetX = e.clientX - dragStartX;
    offsetY = e.clientY - dragStartY;
    scheduleRender();
})
document.addEventListener('mouseup', ()=> isDrag = false);
bigImg.addEventListener('dblclick', resetImgTransform);

// 触摸事件（双指缩放灵敏度0.0015，更灵敏）
bigImg.addEventListener('touchstart', (e) => {
    if(drawMode) return;
    if(e.touches.length === 1){
        isDrag = true;
        dragStartX = e.touches[0].clientX - offsetX;
        dragStartY = e.touches[0].clientY - offsetY;
    }else if(e.touches.length === 2){
        isDrag = false;
        const t1 = e.touches[0], t2 = e.touches[1];
        touchStartDist = Math.hypot(t2.clientX - t1.clientX, t2.clientY - t1.clientY);
        touchCenterX = (t1.clientX + t2.clientX) / 2;
        touchCenterY = (t1.clientY + t2.clientY) / 2;
    }
})
bigImg.addEventListener('touchmove', (e) => {
    if(drawMode) return;
    if(e.touches.length === 1 && isDrag){
        offsetX = e.touches[0].clientX - dragStartX;
        offsetY = e.touches[0].clientY - dragStartY;
        scheduleRender();
    }else if(e.touches.length === 2){
        e.preventDefault();
        const t1 = e.touches[0], t2 = e.touches[1];
        const dist = Math.hypot(t2.clientX - t1.clientX, t2.clientY - t1.clientY);
        const deltaScale = (dist - touchStartDist) * 0.0015;
        const oldScale = scale;
        scale += deltaScale;
        scale = Math.max(0.3, Math.min(5, scale));
        const cx = (t1.clientX + t2.clientX) / 2;
        const cy = (t1.clientY + t2.clientY) / 2;
        offsetX += (cx - touchCenterX) * (1 - scale / oldScale);
        offsetY += (cy - touchCenterY) * (1 - scale / oldScale);
        touchStartDist = dist;
        touchCenterX = cx;
        touchCenterY = cy;
        scheduleRender();
    }
})
bigImg.addEventListener('touchend', () => isDrag = false);

// ========== 涂鸦编辑逻辑 ==========
// 画笔/橡皮切换
const drawTool = document.getElementById("drawTool");
const eraserTool = document.getElementById("eraserTool");
drawTool.onclick = ()=>{
    drawMode = true;
    drawCanvas.classList.add("draw-mode");
    isEraser = false;
    drawTool.classList.add("active");
    eraserTool.classList.remove("active");
}
eraserTool.onclick = ()=>{
    drawMode = true;
    drawCanvas.classList.add("draw-mode");
    isEraser = true;
    eraserTool.classList.add("active");
    drawTool.classList.remove("active");
}
// 颜色选择
document.querySelectorAll(".color-box").forEach(box=>{
    box.onclick = ()=>{
        drawColor = box.style.background;
    }
})
// 撤销涂鸦
document.getElementById("undoDraw").onclick = ()=>{
    if(drawHistory.length === 0) return;
    const last = drawHistory.pop();
    drawCtx.clearRect(0,0,drawCanvas.width,drawCanvas.height);
    drawCtx.putImageData(last,0,0);
}
// 画布触摸涂鸦
drawCanvas.addEventListener("touchstart", (e)=>{
    if(!drawMode) return;
    e.preventDefault();
    isDrawing = true;
    const touch = e.touches[0];
    const rect = drawCanvas.getBoundingClientRect();
    const x = touch.clientX - rect.left;
    const y = touch.clientY - rect.top;
    drawCtx.beginPath();
    drawCtx.moveTo(x * dpr, y * dpr);
    drawCtx.lineCap = "round";
    drawCtx.lineJoin = "round";
    drawCtx.lineWidth = lineWidth * dpr;
    drawCtx.strokeStyle = isEraser ? "#000000" : drawColor;
})
drawCanvas.addEventListener("touchmove", (e)=>{
    if(!drawMode || !isDrawing) return;
    e.preventDefault();
    const touch = e.touches[0];
    const rect = drawCanvas.getBoundingClientRect();
    const x = touch.clientX - rect.left;
    const y = touch.clientY - rect.top;
    drawCtx.lineTo(x * dpr, y * dpr);
    drawCtx.stroke();
})
drawCanvas.addEventListener("touchend", ()=>{
    if(!drawMode || !isDrawing) return;
    isDrawing = false;
    const imgData = drawCtx.getImageData(0,0,drawCanvas.width,drawCanvas.height);
    drawHistory.push(imgData);
})

// ========== 裁剪功能 ==========
document.getElementById("cropTool").onclick = ()=>{
    cropModal.classList.add("active");
    const img = new Image();
    img.src = bigImg.src;
    img.onload = ()=>{
        cropCanvas.width = img.width;
        cropCanvas.height = img.height;
        cropCtx.drawImage(img,0,0);
    }
}
document.getElementById("cancelCrop").onclick = ()=> cropModal.classList.remove("active");
document.getElementById("confirmCrop").onclick = ()=>{
    // 简单居中裁剪 1:1
    const size = Math.min(cropCanvas.width, cropCanvas.height);
    const x = (cropCanvas.width - size) / 2;
    const y = (cropCanvas.height - size) / 2;
    const tempCanvas = document.createElement("canvas");
    tempCanvas.width = size;
    tempCanvas.height = size;
    const tCtx = tempCanvas.getContext("2d");
    tCtx.drawImage(cropCanvas, x, y, size, size, 0,0,size,size);
    editFinalImg = tempCanvas.toDataURL("image/png");
    cropModal.classList.remove("active");
    openSavePreview();
}

// ========== 保存图片（长按存相册） ==========
document.getElementById("saveEdit").onclick = openSavePreview;
function openSavePreview(){
    const mergeCanvas = document.createElement("canvas");
    const mCtx = mergeCanvas.getContext("2d");
    const img = new Image();
    img.src = bigImg.src;
    img.onload = ()=>{
        mergeCanvas.width = img.width;
        mergeCanvas.height = img.height;
        // 绘制原图
        mCtx.drawImage(img,0,0);
        // 叠加涂鸦
        mCtx.drawImage(drawCanvas,0,0,img.width,img.height);
        editFinalImg = mergeCanvas.toDataURL("image/png");
        saveImg.src = editFinalImg;
        saveModal.classList.add("active");
    }
}
document.getElementById("closeSave").onclick = ()=> saveModal.classList.remove("active");

// 返回顶部按钮逻辑
const backTopBtn = document.getElementById("backTopBtn");
window.addEventListener("scroll",()=>{
  if(window.scrollY > 300){
    backTopBtn.style.opacity = "1";
    backTopBtn.style.visibility = "visible";
  }else{
    backTopBtn.style.opacity = "0";
    backTopBtn.style.visibility = "hidden";
  }
})
backTopBtn.onclick = ()=> window.scrollTo({top:0,behavior:"smooth"});
</script>
</body>
