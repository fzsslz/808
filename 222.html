<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>五子棋</title>
<style>
*{box-sizing:border-box;font-family:system-ui}
body{background:#f0f2f5;display:flex;flex-direction:column;align-items:center;padding:10px;margin:0}
h2{color:#333;margin:10px 0}
canvas{border:8px solid #cd7f32;background:#e7b877;border-radius:8px; touch-action: none; max-width:100%}
.ctrl{margin:10px 0;display:flex;gap:8px}
button{padding:8px 12px;background:#165DFF;color:white;border:none;border-radius:6px;font-size:16px;cursor:pointer}
#modeSelect{margin-bottom:10px;display:flex;gap:10px}
#modeSelect button{background:#4CAF50}
#modeSelect button.active{background:#165DFF}
/* 手机按键整体居中 */
#virtual{display:none;width:100%;justify-content:center;margin-top:20px}
.pad{display:grid;grid-template-columns:repeat(3,72px);grid-template-rows:repeat(3,72px);gap:8px}
.pad button{font-size:22px;border-radius:12px;border:none;box-shadow:0 2px 5px #ccc}
.pad .ok{background:#28a745}
@media(max-width:480px){#virtual{display:flex}}
</style>
</head>
<body>
<h2>🎮 五子棋</h2>
<div id="modeSelect">
<button onclick="setMode('pvp')" class="active">双人对战</button>
<button onclick="setMode('pve')">人机对战</button>
</div>
<canvas id="board" width="420" height="420"></canvas>
<div class="ctrl">
<button onclick="restart()">重新开始</button>
</div>

<div id="virtual">
<div class="pad">
<button></button>
<button onclick="moveUp()">↑</button>
<button></button>

<button onclick="moveLeft()">←</button>
<button onclick="placeCursor()" class="ok">落子</button>
<button onclick="moveRight()">→</button>

<button></button>
<button onclick="moveDown()">↓</button>
<button></button>
</div>
</div>

<script>
const canvas=document.getElementById('board');
const ctx=canvas.getContext('2d');
const grid=30;
let board=Array(15).fill().map(()=>Array(15).fill(0));
let cur=1;
let cursorX=7,cursorY=7;
let gameMode='pvp';

function setMode(mode){
  gameMode=mode;
  document.querySelectorAll('#modeSelect button').forEach(btn=>btn.classList.remove('active'));
  event.target.classList.add('active');
  restart();
}

function draw(){
  ctx.fillStyle='#e7b877';
  ctx.fillRect(0,0,420,420);
  
  ctx.strokeStyle='#333';
  ctx.lineWidth=1;
  for(let i=0;i<=14;i++){
    ctx.beginPath();
    ctx.moveTo(i*grid, 0);
    ctx.lineTo(i*grid, 420);
    ctx.stroke();
  }
  for(let i=0;i<=14;i++){
    ctx.beginPath();
    ctx.moveTo(0, i*grid);
    ctx.lineTo(420, i*grid);
    ctx.stroke();
  }

  for(let i=0;i<15;i++){
    for(let j=0;j<15;j++){
      if(board[i][j]){
        ctx.beginPath();
        ctx.arc(j*grid, i*grid, 12, 0, Math.PI*2);
        ctx.fillStyle=board[i][j]==1?'#000':'#fff';
        ctx.fill();
        ctx.strokeStyle='#333';
        ctx.stroke();
      }
    }
  }

  ctx.beginPath();
  ctx.arc(cursorY*grid, cursorX*grid, 10, 0, Math.PI*2);
  ctx.strokeStyle='red';
  ctx.lineWidth=2;
  ctx.stroke();
}

function win(x,y){
  const dir=[[1,0],[0,1],[1,1],[1,-1]];
  for(let [dx,dy] of dir){
    let count=1;
    for(let i=1;i<5;i++) if(board[x+dx*i]?.[y+dy*i]===cur)count++;else break;
    for(let i=1;i<5;i++) if(board[x-dx*i]?.[y-dy*i]===cur)count++;else break;
    if(count>=5)return true;
  }
  return false;
}

function place(x,y){
  if(x<0||x>=15||y<0||y>=15||board[x][y])return;

  board[x][y]=cur;
  draw();

  if(win(x,y)){
    alert((cur==1?'黑':'白')+'棋胜利！');
    restart();
    return;
  }

  cur=3-cur;

  if(gameMode==='pve' && cur===2){
    setTimeout(aiMove,400);
  }
}

// 人机AI
function aiMove(){// 新版聪明AI：会连子、会堵、不瞎下
function aiMove(){
  let bestScore = -9999;
  let bestX = 7, bestY = 7;

  // 遍历所有空位
  for(let i = 0; i < 15; i++){
    for(let j = 0; j < 15; j++){
      if(board[i][j] !== 0) continue;

      let score = 0;
      // 离中心越近加分
      let centerDis = Math.abs(i - 7) + Math.abs(j - 7);
      score += (14 - centerDis) * 8;

      // 四个方向判断
      const dirs = [[1,0],[0,1],[1,1],[1,-1]];
      for(let [dx, dy] of dirs){
        let me = 0, enemy = 0;

        // 往一个方向数
        for(let k = 1; k < 5; k++){
          let ni = i + dx * k;
          let nj = j + dy * k;
          if(ni < 0 || ni >= 15 || nj < 0 || nj >= 15) break;
          if(board[ni][nj] === 2) me++;
          else if(board[ni][nj] === 1) enemy++;
          else break;
        }
        // 反方向数
        for(let k = 1; k < 5; k++){
          let ni = i - dx * k;
          let nj = j - dy * k;
          if(ni < 0 || ni >= 15 || nj < 0 || nj >= 15) break;
          if(board[ni][nj] === 2) me++;
          else if(board[ni][nj] === 1) enemy++;
          else break;
        }

        // 自己连子加分
        if(me === 1) score += 10;
        if(me === 2) score += 30;
        if(me === 3) score += 80;
        if(me === 4) score += 300;

        // 堵对方连子加分
        if(enemy === 2) score += 25;
        if(enemy === 3) score += 70;
        if(enemy === 4) score += 280;
      }

      // 选最高分位置
      if(score > bestScore){
        bestScore = score;
        bestX = i;
        bestY = j;
      }
    }
  }

  // 下最优位置
  board[bestX][bestY] = 2;
  draw();
  cur = 1;

  // 判赢
  if(win(bestX, bestY)){
    alert('电脑获胜！');
    restart();
  }
}
  }
  let arr=[];
  for(let i=0;i<15;i++)for(let j=0;j<15;j++)if(board[i][j]===0)arr.push([i,j]);
  let [x,y]=arr[Math.floor(Math.random()*arr.length)];
  board[x][y]=2;
  draw();
  cur=1;
}

// 手机精准点击修复
canvas.addEventListener('click',function(e){
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;

  let px = (e.clientY - rect.top) * scaleY;
  let py = (e.clientX - rect.left) * scaleX;

  let x = Math.round(px / grid);
  let y = Math.round(py / grid);

  place(x,y);
});

// 键盘方向键
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowUp')moveUp();
  if(e.key==='ArrowDown')moveDown();
  if(e.key==='ArrowLeft')moveLeft();
  if(e.key==='ArrowRight')moveRight();
  if(e.key==='Enter'||e.key===' ')placeCursor();
});

// 虚拟按键
function moveUp(){if(cursorX>0)cursorX--;draw()}
function moveDown(){if(cursorX<14)cursorX++;draw()}
function moveLeft(){if(cursorY>0)cursorY--;draw()}
function moveRight(){if(cursorY<14)cursorY++;draw()}
function placeCursor(){place(cursorX,cursorY)}

function restart(){
  board=Array(15).fill().map(()=>Array(15).fill(0));
  cur=1;
  cursorX=7;cursorY=7;
  draw();
}

draw();
</script>
</body>
</html>
