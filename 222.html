<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>五子棋</title>
<style>
*{box-sizing:border-box;font-family:system-ui}
body{background:#f0f2f5;display:flex;flex-direction:column;align-items:center;padding:10px}
h2{color:#333}
canvas{border:8px solid #cd7f32;background:#e7b877;border-radius:8px; touch-action: none;}
.ctrl{margin:10px 0;display:flex;gap:8px}
button{padding:8px 12px;background:#165DFF;color:white;border:none;border-radius:6px}
#virtual{display:none;grid-template-columns:repeat(3,60px);gap:8px;margin-top:10px}
#virtual button{padding:14px;font-size:18px}
@media(max-width:480px){#virtual{display:grid}}
</style>
</head>
<body>
<h2>🎮 五子棋</h2>
<canvas id="board" width="420" height="420"></canvas>
<div class="ctrl">
<button onclick="restart()">重新开始</button>
</div>
<div id="virtual">
<button></button><button>↑</button><button></button>
<button>←</button><button>↓</button><button>→</button>
</div>

<script>
const canvas=document.getElementById('board');
const ctx=canvas.getContext('2d');
const grid=30;
let board=Array(15).fill().map(()=>Array(15).fill(0));
let cur=1;

function draw(){
  ctx.fillStyle='#e7b877';
  ctx.fillRect(0,0,420,420);
  
  ctx.strokeStyle='#333';
  ctx.lineWidth=1;
  for(let i=0;i<=14;i++){
    ctx.beginPath();
    ctx.moveTo(i*grid, 0);
    ctx.lineTo(i*grid, 420);
    ctx.stroke();
  }
  for(let i=0;i<=14;i++){
    ctx.beginPath();
    ctx.moveTo(0, i*grid);
    ctx.lineTo(420, i*grid);
    ctx.stroke();
  }

  for(let i=0;i<15;i++){
    for(let j=0;j<15;j++){
      if(board[i][j]){
        ctx.beginPath();
        ctx.arc(j*grid, i*grid, 12, 0, Math.PI*2);
        ctx.fillStyle=board[i][j]==1?'#000':'#fff';
        ctx.fill();
        ctx.strokeStyle='#333';
        ctx.stroke();
      }
    }
  }
}

function win(x,y){
  const dir=[[1,0],[0,1],[1,1],[1,-1]];
  for(let [dx,dy] of dir){
    let count=1;
    for(let i=1;i<5;i++) if(board[x+dx*i]?.[y+dy*i]===cur)count++;else break;
    for(let i=1;i<5;i++) if(board[x-dx*i]?.[y-dy*i]===cur)count++;else break;
    if(count>=5)return true;
  }
  return false;
}

function place(x,y){
  if(x<0||x>=15||y<0||y>=15)return;
  if(board[x][y])return;
  board[x][y]=cur;
  draw();
  if(win(x,y)){
    alert((cur==1?'黑':'白')+'棋胜利！');
    restart();
    return;
  }
  cur=3-cur;
}

canvas.addEventListener('click',function(e){
  const rect=canvas.getBoundingClientRect();
  const scaleX=canvas.width/rect.width;
  const scaleY=canvas.height/rect.height;
  
  const x=Math.floor(((e.clientY-rect.top)*scaleY)/grid);
  const y=Math.floor(((e.clientX-rect.left)*scaleX)/grid);
  
  place(x,y);
});

function restart(){
  board=Array(15).fill().map(()=>Array(15).fill(0));
  cur=1;
  draw();
}

draw();
</script>
</body>
</html>
