<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>班级五子棋</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", sans-serif;
        }

        body {
            background-color: #f8f9fa;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            color: #333;
        }

        .title {
            font-size: 28px;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 10px;
        }

        /* 控制栏 */
        .game-controls {
            display: flex;
            gap: 15px;
            margin: 15px 0;
            flex-wrap: wrap;
            justify-content: center;
        }

        .mode-btn, #resetBtn {
            padding: 8px 16px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.2s;
        }

        .mode-btn {
            background: #e9ecef;
        }

        .mode-btn.active {
            background: #3498db;
            color: white;
        }

        #resetBtn {
            background: #e74c3c;
            color: white;
        }

        #resetBtn:hover {
            background: #c0392b;
        }

        /* 当前回合 */
        .status {
            font-size: 18px;
            margin: 10px 0;
            font-weight: 500;
        }

        /* 棋盘 */
        .chess-board {
            width: 560px;
            height: 560px;
            background-color: #e4b56b;
            border: 12px solid #c18c5d;
            border-radius: 8px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            position: relative;
        }

        .grid {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            bottom: 20px;
            background-image: 
                linear-gradient(#5a442b 1px, transparent 1px),
                linear-gradient(90deg, #5a442b 1px, transparent 1px);
            background-size: 36px 36px;
        }

        /* 棋子 */
        .chess {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            position: absolute;
            transform: translate(-50%, -50%);
            box-shadow: 2px 2px 5px rgba(0,0,0,0.3);
        }

        .black {
            background: radial-gradient(circle at 35% 35%, #444, #000);
        }

        .white {
            background: radial-gradient(circle at 35% 35%, #fff, #ddd);
        }

        /* 胜利高亮 */
        .win {
            box-shadow: 0 0 12px 5px #ffeb3b;
            z-index: 10;
        }

        /* 胜利提示 */
        .win-modal {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 25px 40px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
            font-size: 22px;
            font-weight: bold;
            color: #e74c3c;
            display: none;
            z-index: 999;
        }

        /* 适配手机 */
        @media (max-width: 600px) {
            .chess-board {
                width: 90vw;
                height: 90vw;
            }
        }
    </style>
</head>
<body>

<div class="title">🎓 班级五子棋小游戏</div>

<div class="game-controls">
    <button class="mode-btn active" data-mode="double">双人对战</button>
    <button class="mode-btn" data-mode="ai">人机对战</button>
    <button id="resetBtn">重新开始</button>
</div>

<div class="status" id="status">当前回合：黑棋</div>

<div class="chess-board">
    <div class="grid"></div>
</div>

<div class="win-modal" id="winTip"></div>

<script>
    const board = document.querySelector('.chess-board');
    const status = document.getElementById('status');
    const resetBtn = document.getElementById('resetBtn');
    const winTip = document.getElementById('winTip');
    const modeBtns = document.querySelectorAll('.mode-btn');

    const SIZE = 15;
    const UNIT = 36;
    const OFFSET = 20;

    let chessBoard = Array(SIZE).fill().map(() => Array(SIZE).fill(0));
    let currentPlayer = 1; // 1=黑 2=白
    let gameOver = false;
    let gameMode = 'double'; // double / ai

    // 模式切换
    modeBtns.forEach(btn => {
        btn.addEventListener('click', () => {
            modeBtns.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            gameMode = btn.dataset.mode;
            resetGame();
        });
    });

    // 点击落子
    board.addEventListener('click', (e) => {
        if (gameOver) return;

        const rect = board.getBoundingClientRect();
        const x = Math.round((e.clientX - rect.left - OFFSET) / UNIT);
        const y = Math.round((e.clientY - rect.top - OFFSET) / UNIT);

        if (x < 0 || x >= SIZE || y < 0 || y >= SIZE || chessBoard[y][x] !== 0) return;

        playerMove(x, y);
    });

    // 玩家落子
    function playerMove(x, y) {
        placeChess(x, y);
        if (gameOver) return;

        // 人机模式：AI 自动下
        if (gameMode === 'ai' && currentPlayer === 2) {
            setTimeout(aiMove, 300);
        }
    }

    // AI 下棋逻辑
    function aiMove() {
        let bestScore = -1;
        let best = { x: 7, y: 7 };

        for (let y = 0; y < SIZE; y++) {
            for (let x = 0; x < SIZE; x++) {
                if (chessBoard[y][x] !== 0) continue;
                let score = calcScore(x, y, 2);
                score += calcScore(x, y, 1) * 0.9;
                if (score > bestScore) {
                    bestScore = score;
                    best = { x, y };
                }
            }
        }

        placeChess(best.x, best.y);
    }

    // AI 评分（攻防）
    function calcScore(x, y, player) {
        const dirs = [[1,0],[0,1],[1,1],[1,-1]];
        let max = 0;
        for (let [dx, dy] of dirs) {
            let c = 1, blank = 0;
            for (let i = 1; i < 5; i++) {
                const nx = x+dx*i, ny = y+dy*i;
                if (nx<0||nx>=SIZE||ny<0||ny>=SIZE) break;
                if (chessBoard[ny][nx] === player) c++;
                else if (chessBoard[ny][nx] === 0) { blank++; break; }
                else break;
            }
            for (let i = 1; i < 5; i++) {
                const nx = x-dx*i, ny = y-dy*i;
                if (nx<0||nx>=SIZE||ny<0||ny>=SIZE) break;
                if (chessBoard[ny][nx] === player) c++;
                else if (chessBoard[ny][nx] === 0) { blank++; break; }
                else break;
            }
            let s = c*c + blank*0.3;
            if (c >=5) s+=1000;
            if (s>max) max = s;
        }
        return max;
    }

    // 落子渲染
    function placeChess(x, y) {
        chessBoard[y][x] = currentPlayer;
        const chess = document.createElement('div');
        chess.classList.add('chess', currentPlayer === 1 ? 'black' : 'white');
        chess.style.left = x * UNIT + OFFSET + 'px';
        chess.style.top = y * UNIT + OFFSET + 'px';
        board.appendChild(chess);

        if (checkWin(x, y)) {
            gameOver = true;
            winTip.textContent = `🎉 ${currentPlayer === 1 ? '黑棋' : '白棋'}获胜！`;
            winTip.style.display = 'block';
            return;
        }

        currentPlayer = currentPlayer === 1 ? 2 : 1;
        status.textContent = `当前回合：${currentPlayer === 1 ? '黑棋' : '白棋'}`;
    }

    // 判断胜负
    function checkWin(x, y) {
        const p = chessBoard[y][x];
        const dirs = [[1,0],[0,1],[1,1],[1,-1]];
        for (let [dx, dy] of dirs) {
            let cnt = 1;
            let line = [[x,y]];
            for (let i=1; i<5; i++) {
                const nx = x+dx*i, ny = y+dy*i;
                if (nx>=0&&nx<SIZE&&ny>=0&&ny<SIZE&&chessBoard[ny][nx]===p) { cnt++; line.push([nx,ny]); }
                else break;
            }
            for (let i=1; i<5; i++) {
                const nx = x-dx*i, ny = y-dy*i;
                if (nx>=0&&nx<SIZE&&ny>=0&&ny<SIZE&&chessBoard[ny][nx]===p) { cnt++; line.push([nx,ny]); }
                else break;
            }
            if (cnt >=5) {
                line.forEach(([px,py])=>{
                    const el = document.elementFromPoint(
                        board.getBoundingClientRect().left + px*UNIT+OFFSET,
                        board.getBoundingClientRect().top + py*UNIT+OFFSET
                    );
                    if(el) el.classList.add('win');
                });
                return true;
            }
        }
        return false;
    }

    // 重置游戏
    resetBtn.addEventListener('click', resetGame);
    function resetGame() {
        chessBoard = Array(SIZE).fill().map(()=>Array(SIZE).fill(0));
        currentPlayer = 1;
        gameOver = false;
        status.textContent = '当前回合：黑棋';
        winTip.style.display = 'none';
        document.querySelectorAll('.chess').forEach(c=>c.remove());
    }
</script>

</body>
</html>
