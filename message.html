<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>互动空间 - 发布</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,"Microsoft YaHei",sans-serif;}
body{
  min-height:100vh;
  background:linear-gradient(135deg,#6366f1 0%,#ec4899 100%);
  padding:20px;color:#334155;
}
.wrap{max-width:600px;margin:0 auto;}
.top-bar{
  display:flex;justify-content:space-between;align-items:center;
  margin-bottom:20px;flex-wrap:wrap;gap:10px;
}
.top-bar a{color:#fff;text-decoration:none;font-size:14px;opacity:0.9;}
.top-bar a:hover{opacity:1;}
.top-bar h2{color:#fff;font-size:20px;}
.card{
  background:#fff;border-radius:20px;padding:28px 24px;
  box-shadow:0 12px 30px rgba(0,0,0,0.15);
}
.nick-line{
  display:flex;align-items:center;gap:8px;
  font-size:14px;color:#64748b;margin-bottom:16px;
}
.nick-line b{color:#4f46e5;font-size:15px;}
.count-line{
  display:inline-block;padding:6px 14px;border-radius:999px;
  background:#fef3c7;color:#92400e;font-size:13px;
  margin-bottom:16px;
}
.anon-box{
  display:flex;align-items:center;gap:8px;
  padding:12px 14px;background:#f1f5f9;border-radius:12px;
  margin-bottom:18px;cursor:pointer;font-size:14px;color:#475569;
}
.anon-box input{width:18px;height:18px;accent-color:#ec4899;cursor:pointer;}
textarea{
  width:100%;min-height:160px;padding:14px;
  border:2px solid #e2e8f0;border-radius:12px;
  font-size:15px;line-height:1.6;resize:vertical;
  outline:none;transition:border-color 0.2s;
  font-family:inherit;
}
textarea:focus{border-color:#6366f1;}
.char-count{
  text-align:right;font-size:13px;color:#94a3b8;
  margin-top:6px;margin-bottom:16px;
}
.char-count.over{color:#ef4444;font-weight:bold;}
.btn{
  width:100%;padding:14px;border:none;border-radius:12px;
  background:linear-gradient(135deg,#6366f1,#ec4899);
  color:#fff;font-size:16px;font-weight:bold;cursor:pointer;
  transition:transform 0.2s,box-shadow 0.2s;
}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(99,102,241,0.4);}
.btn:active{transform:scale(0.98);}
.back-link{
  display:block;text-align:center;margin-top:16px;
  color:#fff;text-decoration:none;font-size:14px;opacity:0.9;
}
.back-link:hover{opacity:1;}
</style>
</head>
<body>
<div class="wrap">
  <div class="top-bar">
    <a href="space.html">← 返回互动空间</a>
    <h2>💬 发布新内容</h2>
    <a href="index.html">首页 →</a>
  </div>

  <div class="card">
    <div class="nick-line">
      当前发言昵称：<b id="myNick">加载中...</b>
    </div>

    <div class="count-line">
      今日匿名已发布：<b id="anonTodayCount">0</b> / 10 条
    </div>

    <label class="anon-box">
      <input type="checkbox" id="anonCheck">
      🔒 匿名发布（前台不显示昵称，后台可溯源）
    </label>

    <textarea id="msgContent" placeholder="写下你想说的话...最多1000字"></textarea>
    <div class="char-count"><span id="charCount">0</span> / 1000</div>

    <button class="btn" id="submitBtn">🚀 发布</button>
  </div>

  <a href="user.html" class="back-link">个人中心</a>
</div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm'

const supabase = createClient(
  "https://joqqxqzhdhqhcmnbdnex.supabase.co",
  "sb_publishable_Vj7vzrM66ieR8Yx11CgfsQ_45Y1o35O"
)

let user;
let anonTodaySend = 0;

async function init(){
  const {data:{user:u}} = await supabase.auth.getUser()
  if(!u){
    window.location.href = "login.html"
    return
  }
  user = u

  const {data} = await supabase
    .from('user_profile')
    .select('nickname')
    .eq('id', user.id)
    .single()

  document.getElementById('myNick').innerText = data?.nickname || '未设置昵称'

  const today = new Date()
  today.setHours(0,0,0,0)
  const {count} = await supabase
    .from('messages')
    .select('id', {count:'exact'})
    .eq('user_id', user.id)
    .eq('is_anonymous', true)
    .gte('created_at', today.toISOString())

  anonTodaySend = count || 0
  document.getElementById('anonTodayCount').innerText = anonTodaySend
}

const ta = document.getElementById("msgContent")
ta.oninput = () => {
  const len = ta.value.length
  document.getElementById("charCount").innerText = len
  const cc = document.querySelector('.char-count')
  if(len > 950) cc.classList.add('over')
  else cc.classList.remove('over')
  if(len > 1000){
    ta.value = ta.value.slice(0, 1000)
    document.getElementById("charCount").innerText = 1000
  }
}

document.getElementById('submitBtn').onclick = async () => {
  const content = ta.value.trim()
  const isAnonymous = document.getElementById('anonCheck').checked

  if(!content){
    alert("内容不能为空！")
    return
  }
  if(isAnonymous && anonTodaySend >= 10){
    alert("今日匿名已达10条上限！可取消匿名正常发布。")
    return
  }

  const {error} = await supabase.from('messages').insert({
    content: content,
    user_id: user.id,
    is_anonymous: isAnonymous
  })

  if(error){
    alert("发布失败：" + error.message)
  } else {
    alert("发布成功！")
    window.location.href = "space.html"
  }
}

init()
</script>
</body>
</html>
