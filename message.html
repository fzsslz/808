<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>互动空间</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,"Microsoft YaHei",sans-serif;}
body{
  min-height:100vh;
  background:linear-gradient(135deg,#6366f1 0%,#ec4899 100%);
  padding:20px;color:#334155;
}
.wrap{max-width:600px;margin:0 auto;height:calc(100vh - 40px);display:flex;flex-direction:column;}
.top-bar{
  display:flex;justify-content:space-between;align-items:center;
  margin-bottom:16px;flex-wrap:wrap;gap:10px;
}
.top-bar a{color:#fff;text-decoration:none;font-size:14px;opacity:0.9;}
.top-bar a:hover{opacity:1;}
.top-bar h2{color:#fff;font-size:20px;}
.msg-scroll-wrap{
  flex:1;overflow-y:auto;padding-right:4px;margin-bottom:16px;
}
.msg-scroll-wrap::-webkit-scrollbar{width:6px;}
.msg-scroll-wrap::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.4);border-radius:3px;}
.msg-card{
  background:#fff;border-radius:16px;padding:14px 16px;
  margin-bottom:12px;box-shadow:0 4px 14px rgba(0,0,0,0.1);
  animation:fadeIn 0.3s ease;
  position:relative;
}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
.msg-head{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
.avatar{
  width:38px;height:38px;border-radius:50%;
  background:linear-gradient(135deg,#6366f1,#ec4899);
  color:#fff;display:flex;align-items:center;justify-content:center;
  font-size:16px;font-weight:bold;flex-shrink:0;
}
.avatar.anon{background:linear-gradient(135deg,#64748b,#94a3b8);}
.msg-name{font-size:14px;font-weight:bold;color:#1e293b;}
.msg-time{font-size:11px;color:#94a3b8;margin-left:auto;}
.msg-content{font-size:15px;line-height:1.7;color:#334155;word-break:break-word;padding-left:48px;}
.msg-actions{
  margin-top:8px;padding-left:48px;display:flex;gap:8px;
}
.msg-btn{
  font-size:12px;padding:3px 8px;border-radius:6px;border:none;cursor:pointer;
}
.recall-btn{background:#dbeafe;color:#1d4ed8;}
.del-btn{background:#fee2e2;color:#dc2626;}
.empty{text-align:center;color:#fff;padding:40px 0;font-size:14px;opacity:0.8;}
.input-card{
  background:#fff;border-radius:20px;padding:18px;
  box-shadow:0 12px 30px rgba(0,0,0,0.15);flex-shrink:0;
}
.nick-line{font-size:13px;color:#64748b;margin-bottom:10px;}
.nick-line b{color:#4f46e5;}
.count-line{font-size:12px;color:#92400e;background:#fef3c7;padding:4px 10px;border-radius:999px;display:inline-block;margin-bottom:10px;}
.anon-box{display:flex;align-items:center;gap:6px;margin-bottom:10px;font-size:13px;color:#475569;cursor:pointer;}
.anon-box input{width:16px;height:16px;accent-color:#ec4899;}
textarea{
  width:100%;min-height:80px;padding:10px;
  border:2px solid #e2e8f0;border-radius:10px;
  font-size:14px;line-height:1.6;resize:vertical;
  outline:none;transition:border-color 0.2s;font-family:inherit;
}
textarea:focus{border-color:#6366f1;}
.input-row{display:flex;align-items:center;justify-content:space-between;margin-top:8px;}
.char-count{font-size:12px;color:#94a3b8;}
.char-count.over{color:#ef4444;font-weight:bold;}
.btn{
  padding:10px 28px;border:none;border-radius:10px;
  background:linear-gradient(135deg,#6366f1,#ec4899);
  color:#fff;font-size:14px;font-weight:bold;cursor:pointer;
  transition:transform 0.2s;
}
.btn:hover{transform:translateY(-1px);}
.btn:disabled{opacity:0.5;cursor:not-allowed;}
.back-link{display:block;text-align:center;margin-top:14px;color:#fff;text-decoration:none;font-size:13px;opacity:0.85;}
</style>
</head>
<body>
<div class="wrap">
  <div class="top-bar">
    <a href="index.html">← 返回首页</a>
    <h2>💬 互动空间</h2>
    <a href="login.html">个人中心 →</a>
  </div>

  <div class="msg-scroll-wrap">
    <div class="msg-list" id="msgList"></div>
    <div class="empty" id="loading">加载中...</div>
  </div>

  <div class="input-card">
    <div class="nick-line">当前：<b id="myDisplay">加载中...</b>｜座号：<b id="myNo">--</b> <span id="adminTag" style="color:red;display:none;">管理员</span></div>
    <div class="count-line">今日匿名 <b id="anonTodayCount">0</b>/10 条</div>
    <label class="anon-box">
      <input type="checkbox" id="anonCheck"> 🔒 匿名发布（不显示昵称、座号）
    </label>
    <textarea id="msgContent" placeholder="说点什么..."></textarea>
    <div class="input-row">
      <span class="char-count"><span id="charCount">0</span>/1000</span>
      <button class="btn" id="submitBtn">发送</button>
    </div>
  </div>

  <a href="index.html" class="back-link">返回首页</a>
</div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm'

const supabase = createClient(
  "https://joqqxqzhdhqhcmnbdnex.supabase.co",
  "sb_publishable_Vj7vzrM66ieR8Yx11CgfsQ_45Y1o35O"
)

let user
let myProfile = {}
let anonTodaySend = 0
let isAdmin = false

async function init(){
  // 读取登录会话
  const {data:{user:u}} = await supabase.auth.getUser()
  if(!u){
    window.location.href = "login.html"
    return
  }
  user = u

  // 读取当前登录用户的 profiles，包含is_admin
  const {data: profileData, error: profileErr} = await supabase
    .from('profiles')
    .select('username, nickname, is_admin')
    .eq('id', user.id)
    .single()
  
  if(!profileErr){
    myProfile = profileData
    isAdmin = !!profileData.is_admin
    if(isAdmin) document.getElementById('adminTag').style.display = "inline"
  }

  // 页面顶部信息：优先昵称，无昵称就显示座号
  const showName = myProfile.nickname || myProfile.username || "未知同学"
  document.getElementById('myDisplay').innerText = showName
  document.getElementById('myNo').innerText = myProfile.username || "?"

  await loadAnonCount()
  await loadMessages()
}

async function loadAnonCount(){
  const today = new Date()
  today.setHours(0,0,0,0)
  const {count} = await supabase
    .from('messages')
    .select('id', {count:'exact'})
    .eq('user_id', user.id)
    .eq('is_anonymous', true)
    .gte('created_at', today.toISOString())
  anonTodaySend = count || 0
  document.getElementById('anonTodayCount').innerText = anonTodaySend
}

async function loadMessages(){
  // 只加载还没过期的消息（expire_at > 当前时间）
  const now = new Date().toISOString()
  const {data: msgs, error} = await supabase
    .from('messages')
    .select('id, content, created_at, is_anonymous, user_id, can_recall_until')
    .order('created_at', {ascending: false})
    .gt('expire_at', now)

  document.getElementById('loading').style.display = 'none'

  if(error){
    document.getElementById('msgList').innerHTML =
      '<div class="empty">加载失败：' + error.message + '</div>'
    return
  }

  if(!msgs || msgs.length === 0){
    document.getElementById('msgList').innerHTML =
      '<div class="empty">还没有内容，来发第一条吧～</div>'
    return
  }

  // 批量查询所有留言人的 profiles
  const userIds = [...new Set(msgs.map(m => m.user_id))]
  const {data: profilesList} = await supabase
    .from('profiles')
    .select('id, username, nickname')
    .in('id', userIds)

  const profileMap = {}
  if(profilesList){
    profilesList.forEach(p => { profileMap[p.id] = p })
  }

  const wrap = document.getElementById('msgList')
  wrap.innerHTML = msgs.map(item => {
    const isAnon = item.is_anonymous
    const p = profileMap[item.user_id]
    let nameText, avatarChar;

    if(isAnon){
      nameText = "匿名用户";
      avatarChar = "匿";
    }else{
      // 优先昵称，昵称不存在就显示座号
      const displayName = p?.nickname || p?.username || "未知同学";
      nameText = displayName;
      avatarChar = (p?.nickname || p?.username || "?")[0];
    }

    const time = new Date(item.created_at).toLocaleString('zh-CN', {
      month:'numeric', day:'numeric', hour:'2-digit', minute:'2-digit'
    })
    const canRecall = new Date(item.can_recall_until) > new Date()
    let actionHtml = ""
    // 管理员：永久显示删除按钮
    if(isAdmin){
      actionHtml += `<button class="msg-btn del-btn" onclick="deleteMsg('${item.id}')">管理员删除</button>`
    }
    // 1分钟内，可以撤回（任何人都可以撤回这条消息）
    if(canRecall){
      actionHtml += `<button class="msg-btn recall-btn" onclick="recallMsg('${item.id}')">撤回</button>`
    }

    return `
      <div class="msg-card">
        <div class="msg-head">
          <div class="avatar ${isAnon ? 'anon' : ''}">${avatarChar}</div>
          <div class="msg-name">${nameText}</div>
          <div class="msg-time">${time}</div>
        </div>
        <div class="msg-content">${item.content}</div>
        <div class="msg-actions">${actionHtml}</div>
      </div>
    `
  }).join('')
}

// 全局函数：撤回消息（清空内容）
window.recallMsg = async function(msgId){
  const {error} = await supabase.from('messages').update({
    content:"【消息已撤回】"
  }).eq('id', msgId)
  if(error) alert("撤回失败："+error.message)
  await loadMessages()
}

// 全局函数：管理员彻底删除消息
window.deleteMsg = async function(msgId){
  if(!confirm("确定删除这条消息？")) return
  const {error} = await supabase.from('messages').delete().eq('id', msgId)
  if(error) alert("删除失败："+error.message)
  await loadMessages()
}

const ta = document.getElementById("msgContent")
ta.oninput = () => {
  const len = ta.value.length
  document.getElementById("charCount").innerText = len
  document.querySelector('.char-count').classList.toggle('over', len > 950)
  if(len > 1000){
    ta.value = ta.value.slice(0, 1000)
    document.getElementById("charCount").innerText = 1000
  }
}

document.getElementById('submitBtn').onclick = async () => {
  const content = ta.value.trim()
  const isAnonymous = document.getElementById('anonCheck').checked

  if(!content){ alert("内容不能为空！"); return }
  if(isAnonymous && anonTodaySend >= 10){
    alert("今日匿名已达10条上限！"); return
  }

  const btn = document.getElementById('submitBtn')
  btn.disabled = true
  btn.innerText = "发送中..."

  const now = new Date()
  const recallEnd = new Date(now.getTime() + 60*1000) // 1分钟撤回有效期
  const expireEnd = new Date(now.getTime() + 30 * 24 * 60 * 60 * 1000) //30天后过期

  const {error} = await supabase.from('messages').insert({
    content: content,
    user_id: user.id,
    is_anonymous: isAnonymous,
    can_recall_until: recallEnd.toISOString(),
    expire_at: expireEnd.toISOString()
  })

  btn.disabled = false
  btn.innerText = "发送"

  if(error){
    alert("发送失败：" + error.message)
  } else {
    ta.value = ""
    document.getElementById("charCount").innerText = "0"
    document.getElementById('anonCheck').checked = false
    await loadAnonCount()
    await loadMessages()
  }
}

init()
</script>
</body>
</html>
