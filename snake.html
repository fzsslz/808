<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>贪吃蛇</title>
<style>
*{box-sizing:border-box;font-family:system-ui}
body{background:#f0f2f5;display:flex;flex-direction:column;align-items:center;padding:10px}
h2{color:#2e7d32}
#info{display:flex;gap:20px;margin:5px;font-weight:bold}
canvas{border:8px solid #4CAF50;background:#fff;border-radius:8px}
.ctrl{margin:10px;display:flex;gap:6px;flex-wrap:wrap}
button{padding:8px 10px;background:#4CAF50;color:white;border:none;border-radius:6px}
#virtual{display:none;grid-template-columns:repeat(3,70px);gap:8px;margin-top:10px}
#virtual button{padding:16px;font-size:20px}
@media(max-width:480px){#virtual{display:grid}}
</style>
</head>
<body>
<h2>🐍 贪吃蛇</h2>
<div id="info">分数:<span id="sc">0</span> 等级:<span id="lv">1</span> 最高:<span id="bt">0</span></div>
<canvas id="g" width="400" height="400"></canvas>
<div class="ctrl">
<button onclick="setSpeed(150)">简单</button>
<button onclick="setSpeed(100)">正常</button>
<button onclick="setSpeed(50)">地狱</button>
<button onclick="start()">开始</button>
<button onclick="restart()">重置</button>
<button onclick="bounce()">反弹</button>
<button onclick="god()">无敌</button>
</div>
<div id="virtual">
<button></button><button onclick="u()">↑</button><button></button>
<button onclick="l()">←</button><button onclick="d()">↓</button><button onclick="r()">→</button>
</div>

<script>
const ctx=document.getElementById('g').getContext('2d');
let snake=[[10,10]],dx=1,dy=0,fd=[15,15],run=0,sp=120,sc=0,lv=1;
let best=localStorage.getItem('best')||0,bn=0,gd=0;
document.getElementById('bt').innerText=best;

function draw(){
  ctx.fillStyle='#fff';ctx.fillRect(0,0,400,400);
  ctx.fillStyle='#2e7d32';snake.forEach(([x,y])=>ctx.fillRect(x*20,y*20,18,18));
  ctx.fillStyle='#f44336';ctx.fillRect(fd[0]*20,fd[1]*20,18,18);
}

function move(){
  if(!run)return;
  let [x,y]=snake[0];x+=dx;y+=dy;
  if(!bn){if(x<0||x>=20||y<0||y>=20){over();return}}
  else{x=(x+20)%20;y=(y+20)%20}
  if(!gd&&snake.some(([i,j])=>i==x&&j==y)){over();return}
  snake.unshift([x,y]);
  if(x==fd[0]&&y==fd[1]){sc+=10;lv=Math.floor(sc/50)+1;fd=[Math.random()*20|0,Math.random()*20|0]}
  else snake.pop();
  draw();upd();
}

function over(){run=0;if(sc>best){best=sc;localStorage.setItem('best',best);document.getElementById('bt').innerText=best}alert('结束：'+sc)}
function start(){run=1}
function restart(){snake=[[10,10]];dx=1;dy=0;fd=[15,15];run=sc=0;lv=1;upd();draw()}
function setSpeed(s){sp=s;clearInterval(t);t=setInterval(move,sp)}
function bounce(){bn=!bn;alert('反弹：'+(bn?'开':'关'))}
function god(){gd=!gd;alert('无敌：'+(gd?'开':'关'))}
function upd(){document.getElementById('sc').innerText=sc;document.getElementById('lv').innerText=lv}
function u(){if(dy!=1){dx=0;dy=-1}}
function d(){if(dy!=-1){dx=0;dy=1}}
function l(){if(dx!=1){dx=-1;dy=0}}
function r(){if(dx!=-1){dx=1;dy=0}}
document.addEventListener('keydown',e=>{
  if(e.key=='ArrowUp')u();if(e.key=='ArrowDown')d();
  if(e.key=='ArrowLeft')l();if(e.key=='ArrowRight')r();
});
let t=setInterval(move,sp);draw();upd();
</script>
</body>
</html>
