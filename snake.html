<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>贪吃蛇终极版</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:"Microsoft YaHei",sans-serif}
body{background:#f0f2f5;display:flex;justify-content:center;align-items:center;min-height:100vh;flex-direction:column;padding:20px}
.title{font-size:28px;font-weight:bold;margin:10px;color:#2e7d32}
.info{display:flex;gap:25px;margin:10px 0;font-size:17px;font-weight:bold}
.canvas-box{border:8px solid #4CAF50;border-radius:12px;background:#fff;position:relative}
.controls{margin:12px 0;display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
button{padding:10px 14px;border:none;border-radius:8px;background:#4CAF50;color:white;font-size:15px;cursor:pointer}
.rule{max-width:420px;text-align:center;line-height:1.6;color:#444;margin-top:5px}
#gameOver{position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(255,0,0,0.2);display:none;justify-content:center;align-items:center;color:red;font-size:30px;font-weight:bold;border-radius:8px}
</style>
</head>
<body>
<div class="title">🐍 贪吃蛇大作战 · 终极版</div>
<div class="info">
分数：<span id="score">0</span> &nbsp;&nbsp; 
等级：<span id="level">1</span> &nbsp;&nbsp; 
最高分：<span id="best">0</span>
</div>
<div class="canvas-box" id="box">
<canvas id="snake" width="400" height="400"></canvas>
<div id="gameOver">游戏结束</div>
</div>
<div class="controls">
<button onclick="setSpeed(150)">简单</button>
<button onclick="setSpeed(100)">正常</button>
<button onclick="setSpeed(50)">地狱</button>
<button onclick="start()">开始</button>
<button onclick="pause()">暂停</button>
<button onclick="restart()">重置</button>
<button onclick="toggleBounce()">反弹模式</button>
<button onclick="toggleGod()">无敌模式</button>
</div>
<div class="rule">
方向键移动，吃食物加分升级；反弹模式撞墙不亡，无敌模式不会自撞
</div>
<script>
const canvas=document.getElementById('snake');
const ctx=canvas.getContext('2d');
const grid=20;
let snake=[{x:10,y:10}];
let dx=1,dy=0;
let food={x:15,y:15};
let running=false,paused=false;
let speed=120;
let score=0,level=1;
let best=localStorage.getItem('snakeBest')||0;
let bounceMode=false,godMode=false;
let gameLoop;
const go=document.getElementById('gameOver');

document.getElementById('best').innerText=best;

function draw(){
    ctx.fillStyle="#fff";
    ctx.fillRect(0,0,400,400);
    ctx.fillStyle="#2e7d32";
    snake.forEach(s=>ctx.fillRect(s.x*grid,s.y*grid,grid-2,grid-2));
    ctx.fillStyle="#f44336";
    ctx.fillRect(food.x*grid,food.y*grid,grid-2,grid-2);
}

function move(){
    if(!running||paused)return;
    const head={x:snake[0].x+dx,y:snake[0].y+dy};
    
    if(!bounceMode){
        if(head.x<0||head.x>=20||head.y<0||head.y>=20){gameOver();return;}
    }else{
        if(head.x<0)head.x=19;
        if(head.x>=20)head.x=0;
        if(head.y<0)head.y=19;
        if(head.y>=20)head.y=0;
    }

    if(!godMode){
        for(let i=1;i<snake.length;i++){
            if(head.x==snake[i].x&&head.y==snake[i].y){gameOver();return;}
        }
    }

    snake.unshift(head);
    if(head.x==food.x&&head.y==food.y){
        score+=10;
        level=Math.floor(score/50)+1;
        update();
        food={x:Math.floor(Math.random()*20),y:Math.floor(Math.random()*20)};
    }else snake.pop();
    draw();
}

function gameOver(){
    running=false;
    go.style.display="flex";
    if(score>best){best=score;localStorage.setItem('snakeBest',best);document.getElementById('best').innerText=best;}
    setTimeout(()=>alert("游戏结束！得分："+score),100);
}

function start(){go.style.display="none";running=true;paused=false}
function pause(){paused=!paused}
function restart(){
    snake=[{x:10,y:10}];dx=1;dy=0;food={x:15,y:15};
    running=false;paused=false;score=0;level=1;update();
    go.style.display="none";draw();
}
function setSpeed(s){speed=s;clearInterval(gameLoop);gameLoop=setInterval(move,speed);}
function toggleBounce(){bounceMode=!bounceMode;alert("反弹模式："+(bounceMode?"开启":"关闭"));}
function toggleGod(){godMode=!godMode;alert("无敌模式："+(godMode?"开启":"关闭"));}
function update(){
    document.getElementById('score').innerText=score;
    document.getElementById('level').innerText=level;
    document.getElementById('best').innerText=best;
}
document.addEventListener("keydown",e=>{
    if(e.key==="ArrowUp"&&dy===0){dx=0;dy=-1}
    else if(e.key==="ArrowDown"&&dy===0){dx=0;dy=1}
    else if(e.key==="ArrowLeft"&&dx===0){dx=-1;dy=0}
    else if(e.key==="ArrowRight"&&dx===0){dx=1;dy=0}
})
gameLoop=setInterval(move,speed);
draw();update();
</script>
</body>
</html>
