<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <!-- 手机强制适配屏幕 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>班级专属视频页</title>
    <style>
        :root {
            --primary: #6366f1;
            --primary-deep: #4f46e5;
            --pink: #ec4899;
            --pink-deep: #db2777;
            --glass-light: rgba(255,255,255,0.85);
            --glass-border: rgba(255,255,255,0.6);
            --shadow-soft: 0 8px 24px rgba(99, 102, 241, 0.12);
            --shadow-hover: 0 16px 36px rgba(99, 102, 241, 0.18);
            --radius-md: 16px;
            --radius-lg: 24px;
            --transition-normal: 0.35s ease;
        }
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            transition: background var(--transition-normal), color var(--transition-normal), transform 0.25s ease, box-shadow var(--transition-normal);
        }
        body {
            padding: 20px 15px;
            font-family: "Microsoft YaHei", sans-serif;
            background:
                radial-gradient(circle at 10% 10%, rgba(99, 102, 241, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 90% 20%, rgba(236, 72, 153, 0.08) 0%, transparent 50%),
                linear-gradient(135deg, #fdf4ff 0%, #e0e7ff 100%);
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 840px;
            margin: 0 auto;
            background: var(--glass-light);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            padding: 32px 24px;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-soft);
            transform-style: preserve-3d;
            perspective: 1000px;
        }
        h1 {
            text-align: center;
            color: var(--primary);
            margin-bottom: 36px;
            font-size: clamp(22px,5vw,28px);
            font-weight: 700;
            letter-spacing: 1px;
            position: relative;
        }
        h1::after {
            content: "";
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            bottom: -10px;
            width: 80px;
            height: 3px;
            background: linear-gradient(90deg,var(--primary),var(--pink));
            border-radius: 3px;
        }
        .video-card {
            width: 100%;
            height: auto;
            aspect-ratio: 16 / 9;
            margin-bottom: 28px;
            border-radius: var(--radius-md);
            overflow: hidden;
            background: #000;
            box-shadow: var(--shadow-soft);
            border: 1px solid var(--glass-border);
            transform: translateY(0);
        }
        .video-card:hover {
            transform: translateY(-6px) rotateX(1.5deg);
            box-shadow: var(--shadow-hover);
        }
        iframe{
            width: 100%;
            height: 100%;
            border: none;
        }
        .back-button {
            display: block;
            width: 160px;
            margin: 20px auto 0;
            padding: 12px 20px;
            background: linear-gradient(135deg,var(--primary),var(--pink));
            color: white;
            text-align: center;
            text-decoration: none;
            border-radius: var(--radius-md);
            font-weight: 600;
            box-shadow: 0 6px 16px rgba(99, 102, 241, 0.25);
        }
        .back-button:hover {
            background: linear-gradient(135deg,var(--primary-deep),var(--pink-deep));
            transform: translateY(-4px);
            box-shadow: 0 10px 24px rgba(99, 102, 241, 0.35);
        }
        .back-button:active {
            transform: translateY(-2px) scale(0.97);
        }

        /* 深色模式全局适配（和首页完全统一） */
        body.dark {
            background:
                radial-gradient(circle at 10% 10%, rgba(129, 140, 248, 0.12) 0%, transparent 50%),
                radial-gradient(circle at 90% 20%, rgba(244, 114, 182, 0.12) 0%, transparent 50%),
                linear-gradient(135deg, #1e1b4b 0%, #312e81 100%);
        }
        body.dark .container {
            background: rgba(68, 64, 132, 0.75);
            border: 1px solid rgba(255,255,255,0.15);
            box-shadow: 0 8px 24px rgba(0,0,0,0.35);
        }
        body.dark h1 {
            color: #c7d2fe;
        }
        body.dark .video-card {
            border-color: rgba(255,255,255,0.12);
        }
        body.dark .back-button {
            background: linear-gradient(135deg,#4f46e5,#db2777);
        }
        body.dark .back-button:hover {
            background: linear-gradient(135deg,#3b36a1,#b91c5c);
        }

        /* 移动端极致适配 */
        @media (max-width: 600px) {
            .container {
                padding: 24px 16px;
            }
            .video-card {
                margin-bottom: 20px;
            }
            .back-button {
                width: 140px;
                padding: 10px 16px;
            }
        }
    </style>
</head>

<!-- 返回顶部按钮（渐变配色和主题统一） -->
<button id="backTopBtn" style="position:fixed;right:24px;bottom:80px;width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--pink));border:none;opacity:0;visibility:hidden;transition:0.3s all ease;z-index:998;box-shadow:0 4px 14px rgba(99,102,241,0.3);display:flex;align-items:center;justify-content:center;cursor:pointer;">
  <span style="width:0;height:0;border-left:11px solid transparent;border-right:11px solid transparent;border-bottom:18px solid #fff;"></span>
</button>

<script>
// 页面加载自动同步深浅色记忆（和首页localStorage互通）
(function(){
  const saveTheme = localStorage.getItem("siteTheme");
  const darkBtn = document.getElementById("darkBtn");
  if(saveTheme === "dark"){
    document.body.classList.add("dark");
    darkBtn.innerText = "浅色模式";
  }
})();

// 返回顶部逻辑
const backBtn = document.getElementById("backTopBtn");
backBtn.onmouseover = ()=> backBtn.style.background="linear-gradient(135deg,var(--primary-deep),var(--pink-deep))";
backBtn.onmouseout = ()=> backBtn.style.background="linear-gradient(135deg,var(--primary),var(--pink))";
window.addEventListener("scroll",()=>{
  if(window.scrollY > 300){
    backBtn.style.opacity = "1";
    backBtn.style.visibility = "visible";
  }else{
    backBtn.style.opacity = "0";
    backBtn.style.visibility = "hidden";
  }
})
backBtn.onclick = ()=> window.scrollTo({top:0,behavior:"smooth"});

// 深色模式切换函数（全站完全同步存储）
function toggleDark() {
  const body = document.body;
  const btn = document.getElementById("darkBtn");
  body.classList.toggle("dark");
  let nowTheme;
  if(body.classList.contains("dark")){
    btn.innerText = "浅色模式";
    nowTheme = "dark";
  }else{
    btn.innerText = "深色模式";
    nowTheme = "light";
  }
  localStorage.setItem("siteTheme", nowTheme);
}
</script>
